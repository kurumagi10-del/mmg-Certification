とする。", "c": "MLO撮影ではCC撮影に重点をおいたポジショニングを行うため、正中寄りがブラインドとなりやすい。", "d": "MLO撮影では内側上部、CC撮影では乳房下部とCD領域の正中寄りがブラインドとなる。", "e": "MLO撮影では圧迫板の上端を鎖骨下に、胸壁側を胸骨前面に平行で胸骨に当たらない位置関係にすると良い。"}, "correct": ["d"], "explanation": "MLO撮影では内側上部、CC撮影では乳房上部とCD領域の外側寄りがブラインドとなる。", "image_url": "", "reference": "", "tags": ["撮影技術"]}, {"id": "SF-06", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "日本人の平均乳房では圧迫圧は8〜10kgである。", "b": "圧迫は受診者が過大な苦痛を感じない圧迫であること。", "c": "体型が痩せ型で乳房が小さい場合、MLO撮影は不向きである。", "d": "CC撮影では片手で引き伸ばし、押さえながら圧迫板で圧迫する。", "e": "CC撮影では乳房の小さい人は外側から押し込むと良い結果が得られる。"}, "correct": ["a"], "explanation": "日本人女性の乳房は最大圧迫120N（約12kg）を目安とする。", "image_url": "", "reference": "", "tags": ["乳房圧迫"]}, {"id": "SF-07", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "日本人の圧迫は100〜150Nが目安である。", "b": "左右乳腺を比較するため、圧迫圧を左右同じにする。", "c": "乳頭側と胸壁側で厚さが違うほどコントラストがつく。", "d": "圧迫すると被写体受像距離が短くなり幾何学的なブレが少なくなる。", "e": "デジタルマンモグラフィでも線量が不足すると写真濃度が低くなる。"}, "correct": ["a", "d"], "explanation": "圧迫圧を同じにする必要はない。乳頭側と胸壁側で厚さが違うほどコントラストが悪くなる。デジタルは濃度が一定なので必ず低くなるわけではない。", "image_url": "", "reference": "", "tags": ["乳房圧迫"]}, {"id": "SF-08", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "CCとMLOの乳頭後方線はCCの方が長い。", "b": "MLO撮影では圧迫が完了する寸前に手を上方外側へ外していく。", "c": "D領域にある病変がMLO撮影で乳頭よりも上側にくることがある。", "d": "CC撮影は受診者検側の肘をやや外に持ち上げるとブラインドエアが減少する。", "e": "MLO撮影での乳房下角の高さは、カセッテホルダ下縁より2〜3横指上方が望ましい。"}, "correct": ["a"], "explanation": "CCとMLOの乳頭後方線はMLOの方が長い。", "image_url": "", "reference": "", "tags": ["撮影技術"]}, {"id": "SF-09", "category": "撮影法", "subcategory": "標準撮影", "question": "MLO撮影について誤っているのはどれか。2つ選べ。", "choices": {"a": "乳房の上部外側の深部が描出可能である。", "b": "大胸筋の内側と平行にカセッテホルダを整位する。", "c": "上部内側や乳房下部組織がブラインドとなりやすい。", "d": "腹部が入っていると十分に乳腺が前方に伸ばせている。", "e": "カセッテホルダ上角の垂線よりやや前寄りに立つと良い。"}, "correct": ["b", "d"], "explanation": "大胸筋の外側と平行にカセッテホルダを整位する。腹部が入っていても圧迫が弱いと、十分に乳腺が前方に伸ばせていない。", "image_url": "", "reference": "", "tags": ["MLO撮影"]}, {"id": "SF-10", "category": "撮影法", "subcategory": "標準撮影", "question": "MLO撮影について誤っているのはどれか。2つ選べ。", "choices": {"a": "常に角度を一定にする。", "b": "カセッテの上端を腋窩部に合わせる。", "c": "髪の毛が入るのに注意が必要である。", "d": "痩せた人や男性の乳房を撮影する時はカセッテを立てると良い。", "e": "重力によって下垂しやすいため、下方から上方に持ち上げて広げる。"}, "correct": ["a", "c"], "explanation": "体型によって角度を変える。CC撮影では髪の毛が入るのに注意が必要である。", "image_url": "", "reference": "", "tags": ["MLO撮影"]}, {"id": "SF-11", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "受診者の協力と理解が大切である。", "b": "被ばくの説明は必ず行う必要はない。", "c": "乳腺の構造を理解して整位することが大切である。", "d": "ドクターが被爆の説明をしている場合は技師が説明する必要ない。", "e": "マンモ検診を受けるのは女性が多いので壁をピンクの花柄にした。"}, "correct": ["b", "d"], "explanation": "被ばくの説明は必ず技師が行う。ドクターが被爆の説明をしても技師が説明する。", "image_url": "", "reference": "", "tags": ["撮影管理"]}, {"id": "SF-12", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "標準撮影では大焦点を使用する。", "b": "被写体が厚い乳房ではグリッドを外す。", "c": "良いポジショニングは良い画質をつくる。", "d": "圧迫板は固定組織から可動組織にむかって固定していく。", "e": "ポジショニングを行う時は固定組織を可動性組織側に移動する。"}, "correct": ["b", "e"], "explanation": "グリッドは必ず使用する。ポジショニングを行うときは可動性組織を固定組織側に移動する。", "image_url": "", "reference": "", "tags": ["撮影技術"]}, {"id": "SF-13", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "C領域には乳腺が少ないので伸ばしやすい。", "b": "乳癌の発生場所はCとC'で約55％を占める。", "c": "日本人女性の場合、最大圧迫圧は8〜12kgを目安とする。", "d": "アナログシステムでは照射時間が2秒以下になるようにする。", "e": "CRではAECが乳腺からずれると乳腺の濃度が低い写真となる。"}, "correct": ["a", "e"], "explanation": "C領域は乳腺が多い。デジタルは濃度が一定であるが、線量が少なくなり過ぎると写真濃度も低くなることがある。", "image_url": "", "reference": "", "tags": ["撮影技術"]}, {"id": "SF-14", "category": "撮影法", "subcategory": "標準撮影", "question": "CC撮影について誤っているのはどれか。2つ選べ。", "choices": {"a": "MLO撮影を補完できる。", "b": "オープンスタンス(ツ)に立つと良い。", "c": "日本人乳房はMLO撮影よりも圧迫を強くする。", "d": "検側内側からポジショニングを行い、内側を目視する。", "e": "髪の毛がかかる場合があるので十分に注意が必要である。"}, "correct": ["b", "c"], "explanation": "装置に向かって足を平行にして立つ。必ずしもMLO撮影よりも強く圧迫するわけではない。", "image_url": "", "reference": "", "tags": ["CC撮影"]}, {"id": "SF-15", "category": "撮影法", "subcategory": "標準撮影", "question": "CC撮影について誤っているのはどれか。2つ選べ。", "choices": {"a": "検者はなるべく正面を向く。", "b": "乳房上部は可動性のため、CCで描出しやすい。", "c": "支持台を高くすると乳房下部がブラインドエリアとなりやすい。", "d": "ポジショニングは乳房を充分持ち上げた時の手の高さにすると良い。", "e": "検側内側の方向からポジショニングを行うのは乳房外側部もより引き出しやすくするためである。"}, "correct": ["a", "b"], "explanation": "被検者は正面を向く。乳房上部は固定のためCCで描出しにくい。", "image_url": "", "reference": "", "tags": ["CC撮影"]}, {"id": "SF-16", "category": "撮影法", "subcategory": "標準撮影", "question": "CC撮影について誤っているのはどれか。2つ選べ。", "choices": {"a": "石灰乳石灰化はTea cup signとなる。", "b": "外側に皮膚の皺(しわ)が入りやすい。", "c": "内側が欠けないように目視することが大切である。", "d": "撮影台を上げ過ぎると乳頭が乳腺内に入り込みやすい。", "e": "MLOよりも広がりにくいため、圧迫板で広げて撮影する。"}, "correct": ["a", "e"], "explanation": "石灰乳石灰化はCC撮影では不明瞭である。手で引き伸ばし押さえながら圧迫板で圧迫する。", "image_url": "", "reference": "", "tags": ["CC撮影"]}, {"id": "SF-17", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "MLO撮影ではアームの角度は常に65度程度にすれば良い。", "b": "CC撮影はMLO撮影の補完撮影であるので、内側を欠かしてはならない。", "c": "MLO撮影では大胸筋と広背筋の間にカセッテホルダ前面上角をはめ込むようにする。", "d": "MLO撮影ではカセッテホルダの高さは乳房を持ち上げたときのinframammary foldの高さに調整する。", "e": "MLO撮影で大胸筋の前面縁が凹状になっているときは肩が上がったり、腕が外転したり、力が入った結果、生じる像である。"}, "correct": ["a"], "explanation": "下垂乳房45〜50度、標準60〜70度、痩せ型70〜80度 アームの角度は体型によって変わる。", "image_url": "", "reference": "", "tags": ["MLO撮影"]}, {"id": "SF-18", "category": "撮影法", "subcategory": "標準撮影", "question": "次のうち誤っているものはどれか。", "choices": {"a": "MLO撮影では乳房の内側上部や乳房下部組織がブラインドとなりやすい。", "b": "CC撮影では乳房の大きい人は肩を下げ、小乳房の人は肩を下げる。", "c": "MLO撮影では大胸筋と広背筋の間にカセッテホルダ前面上角をはめ込むようにする。", "d": "MLO撮影で大胸筋の前面縁が後方のフィルム縁と平行となっているときは体が圧迫板から後方にずれた結果生じる像である。", "e": "CC撮影では乳房を手で引き伸ばしながら圧迫板で圧迫していき、圧迫板が完了する寸前で乳房を伸ばしながら手を外していく。"}, "correct": ["b"], "explanation": "CC撮影では乳房の大きい人は肩を下げ、小乳房の人は外側から押し込むと良い。", "image_url": "", "reference": "", "tags": ["撮影技術"]}, {"id": "SF-19", "category": "撮影法", "subcategory": "標準撮影", "question": "MLO撮影について誤っているのはどれか。2つ選べ。", "choices": {"a": "AECを乳頭から2cm胸壁側に設定する。", "b": "上部外側や乳房下部組織がブライ let CASES = [];
window.__casesLoaded = false;
let casesLoadPromise = null;
function loadCases(){
  if(!casesLoadPromise){
    casesLoadPromise = fetch('./cases.json')
      .then(r=>r.json())
      .then(data=>{ CASES = data; window.__casesLoaded = true; return CASES; })
      .catch(err=>{ console.error('cases.json load failed', err); CASES = []; window.__casesLoaded = true; return CASES; });
  }
  return casesLoadPromise;
}
/* start fetching in the background right away, so it is likely ready by the time the user opens the tab */
loadCases().then(()=>{ if(document.getElementById('panelCase').classList.contains('active')) renderCaseList(); });

/* ---------- state ---------- */

/* ---------- proficiency tracking (stored in this browser only) ---------- */
const PROGRESS_KEY = 'mammoQuizProgress_v1';
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); }catch(e){ progress = {}; }

function saveProgress(){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }catch(e){ /* storage unavailable, continue silently */ }
}

function recordAnswer(qid, isCorrect){
  if(!progress[qid]) progress[qid] = {attempts:0, correct:0, history:[]};
  const rec = progress[qid];
  rec.attempts++;
  if(isCorrect) rec.correct++;
  rec.history.push(isCorrect);
  if(rec.history.length>5) rec.history.shift();
  saveProgress();
}

const MASTERY_LABEL = {new:'未挑戦', weak:'苦手', learning:'学習中', mastered:'習得'};

function computeMastery(rec){
  if(!rec || rec.attempts===0) return 'new';
  const h = rec.history;
  const acc = h.filter(Boolean).length / h.length;
  if(acc < 0.5) return 'weak';
  if(acc < 0.8 || h.length < 2) return 'learning';
  return 'mastered';
}

function masteryOf(qid){
  return computeMastery(progress[qid]);
}

try{ caseProgress = JSON.parse(localStorage.getItem(CASE_PROGRESS_KEY) || '{}'); }catch(e){ caseProgress = {}; }

function saveCaseProgress(){
  try{ localStorage.setItem(CASE_PROGRESS_KEY, JSON.stringify(caseProgress)); }catch(e){}
}

function recordCaseAnswer(cid, isCorrect){
  if(!caseProgress[cid]) caseProgress[cid] = {attempts:0, correct:0, history:[]};
  const rec = caseProgress[cid];
  rec.attempts++;
  if(isCorrect) rec.correct++;
  rec.history.push(isCorrect);
  if(rec.history.length>5) rec.history.shift();
  saveCaseProgress();
}

function caseMasteryOf(cid){
  return computeMastery(caseProgress[cid]);
}

const catList = document.getElementById('catList');
const countRow = document.getElementById('countRow');
const selCountEl = document.getElementById('selCount');
const tabMcCount = document.getElementById('tabMcCount');
const filmstrip = document.getElementById('filmstrip');
const brandSub = document.getElementById('brandSub');

/* build category map */
const catMap = {};
QUESTIONS.forEach(q=>{
  if(!catMap[q.category]) catMap[q.category] = {count:0, subs:new Set()};
  catMap[q.category].count++;
  catMap[q.category].subs.add(q.subcategory);
});
Object.keys(catMap).forEach(c=>selectedCats.add(c));

function renderCatList(){
  catList.innerHTML = '';
  Object.keys(catMap).forEach(cat=>{
    const row = document.createElement('div');
    row.className = 'cat-row' + (selectedCats.has(cat) ? ' checked' : '');
    row.innerHTML = `
      <div class="checkbox"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div style="flex:1;">
        <div class="cname">${cat}</div>
      </div>
      <div class="cn">${catMap[cat].count}問</div>
    `;
    row.addEventListener('click', ()=>{
      if(selectedCats.has(cat)) selectedCats.delete(cat); else selectedCats.add(cat);
      renderCatList();
      renderCountRow();
    });
    catList.appendChild(row);
  });
  const total = filteredQuestions().length;
  selCountEl.textContent = `${total}問が選択中の分野に該当`;
  tabMcCount.textContent = `全${QUESTIONS.length}問`;
}

function filteredQuestions(){
  return QUESTIONS.filter(q=>selectedCats.has(q.category) && selectedLevels.has(masteryOf(q.id)));
}

function renderLevelRow(){
  const levelRow = document.getElementById('levelRow');
  const levels = ['new','weak','learning','mastered'];
  levelRow.innerHTML = '';
  levels.forEach(lv=>{
    const chip = document.createElement('div');
    chip.className = 'count-chip' + (selectedLevels.has(lv) ? ' selected' : '');
    chip.dataset.level = lv;
    chip.textContent = MASTERY_LABEL[lv];
    chip.addEventListener('click', ()=>{
      if(selectedLevels.has(lv)) selectedLevels.delete(lv); else selectedLevels.add(lv);
      renderLevelRow();
      renderCatList();
      renderCountRow();
    });
    levelRow.appendChild(chip);
  });
}

function renderCountRow(){
  const total = filteredQuestions().length;
  const options = [10,20,30,50];
  countRow.innerHTML = '';
  options.filter(o=>o<total).forEach(o=>{
    const chip = document.createElement('div');
    chip.className = 'count-chip' + (String(selectedCount)===String(o) ? ' selected':'');
    chip.textContent = `${o}問`;
    chip.addEventListener('click', ()=>{selectedCount=o; renderCountRow();});
    countRow.appendChild(chip);
  });
  const allChip = document.createElement('div');
  allChip.className = 'count-chip' + (selectedCount==='all' ? ' selected':'');
  allChip.textContent = `全問(${total})`;
  allChip.addEventListener('click', ()=>{selectedCount='all'; renderCountRow();});
  countRow.appendChild(allChip);
  selCountEl.textContent = `${total}問が選択中の分野に該当`;
}

/* ---------- image case viewer ---------- */
let currentCaseIdx = 0;
let caseOrder = [];
let caseOrderMode = 'sequence';
let caseSelection = {}; // { [caseId]: {picked: number|null, submitted: bool} }
const tabCaseCount = document.getElementById('tabCaseCount');

function computeCaseOrder(){
  const idxs = CASES.map((_,i)=>i);
  caseOrder = caseOrderMode==='random' ? shuffle(idxs) : idxs;
}

function renderCaseList(){
  computeCaseOrder();
  tabCaseCount.textContent = CASES.length ? `全${CASES.length}症例` : '';
  const listEl = document.getElementById('caseListView');
  if(CASES.length===0){
    listEl.innerHTML = window.__casesLoaded ? `<div class="card empty-tab">
      <div class="big-icon">🩻</div>
      <h3>画像症例モードは準備中です</h3>
      <p>画像+カテゴリー判定+解説形式の症例問題は現在データ整備中です。<br>元のPDFを処理してこのタブに追加します。</p>
    </div>` : `<div class="card empty-tab">
      <div class="big-icon">⏳</div>
      <h3>症例データを読み込み中です</h3>
      <p>初回はネットワーク経由で少し時間がかかります。次回からはすぐに開けます。</p>
    </div>`;
    return;
  }
  const items = CASES.map((c,i)=>{
    const lv = caseMasteryOf(c.id);
    return `<div class="case-list-item" data-idx="${i}">
      <div class="case-thumb"><img src="${c.images[0].src}" alt=""></div>
      <div>
        <div class="ctitle">${c.title}</div>
        <div class="csub">${c.images.length}枚の画像</div>
      </div>
      <span class="mastery-pill ${lv}" style="margin-left:auto;">${MASTERY_LABEL[lv]}</span>
    </div>`;
  }).join('');
  listEl.innerHTML = `<div class="card">
    <div class="section-label">出題順</div>
    <div class="order-row">
      <div class="count-chip ${caseOrderMode==='sequence'?'selected':''}" id="caseOrderSeq">順番</div>
      <div class="count-chip ${caseOrderMode==='random'?'selected':''}" id="caseOrderRand">ランダム</div>
    </div>
    <button class="btn btn-primary" id="caseStartBtn" style="margin-top:16px;">${caseOrderMode==='random'?'ランダムに1問目から始める':'症例1から順に始める'}</button>
    <div class="section-label" style="margin-top:22px;">症例一覧</div>
    ${items}
  </div>`;
  listEl.querySelectorAll('.case-list-item').forEach(el=>{
    el.addEventListener('click', ()=>{ computeCaseOrder(); openCaseByRealIdx(Number(el.dataset.idx)); });
  });
  document.getElementById('caseOrderSeq').addEventListener('click', ()=>{ caseOrderMode='sequence'; renderCaseList(); });
  document.getElementById('caseOrderRand').addEventListener('click', ()=>{ caseOrderMode='random'; renderCaseList(); });
  document.getElementById('caseStartBtn').addEventListener('click', ()=>{
    computeCaseOrder();
    openCaseAtPos(0);
  });
}

function openCaseByRealIdx(realIdx){
  const pos = caseOrder.indexOf(realIdx);
  openCaseAtPos(pos>=0?pos:0);
}

function openCaseAtPos(pos){
  currentCaseIdx = pos;
  document.getElementById('caseListView').style.display='none';
  document.getElementById('caseDetailView').style.display='block';
  renderCaseDetail();
}

function closeCaseDetail(){
  document.getElementById('caseDetailView').style.display='none';
  document.getElementById('caseListView').style.display='block';
  renderCaseList();
}

function renderCaseDetail(){
  const c = CASES[caseOrder[currentCaseIdx]];
  if(!caseSelection[c.id]) caseSelection[c.id] = {picked:null, submitted:false};
  const sel = caseSelection[c.id];

  const galleryHtml = c.images.map(im=>`
    <figure><img src="${im.src}" alt="${im.label}"><figcaption>${im.label}</figcaption></figure>
  `).join('');

  const choiceHtml = [1,2,3,4,5].map(n=>{
    let cls = 'cat-choice';
    if(sel.picked===n) cls += ' selected';
    if(sel.submitted){
      if(n===c.categoryNum) cls += ' correct';
      else if(sel.picked===n) cls += ' wrong';
    }
    return `<div class="${cls}" data-n="${n}">${n}</div>`;
  }).join('');

  let resultNoteHtml = '';
  if(sel.submitted){
    const isCorrect = sel.picked===c.categoryNum;
    resultNoteHtml = `<div class="case-result-note ${isCorrect?'ok':'ng'}">${isCorrect? '正解！' : `不正解 — 正解は カテゴリー${c.categoryNum}`}</div>`;
  }

  const revealHtml = sel.submitted ? `
    <div class="reveal-panel">
      <div class="section-label">解答</div>
      <div class="answer-box">
        <div class="a-finding">${c.finding}</div>
        <div class="a-arrow">↓</div>
        <div class="a-cat">${c.birads}</div>
        <div class="a-arrow">↓</div>
        <div class="a-diagnosis">${c.diagnosis}</div>
      </div>
      <div class="case-schema">${c.schema ? `<img src="${c.schema}" alt="シェーマ図">` : ''}</div>
      ${c.explanation ? `<div class="case-explanation">${c.explanation}</div>` : ''}
      ${c.reference ? `<div class="case-reference">出典: ${c.reference}</div>` : ''}
    </div>
  ` : '';

  document.getElementById('caseDetailView').innerHTML = `
    <div class="quiz-top">
      <div class="quiz-progress"><b>${currentCaseIdx+1}</b> / ${CASES.length}</div>
      <div class="q-id">${c.id}</div>
    </div>
    <div class="card">
      <div class="tag-row"><div class="tag">${c.title}</div><div class="tag sub">${c.subcategory}</div></div>
      <div class="case-gallery">${galleryHtml}</div>
      <div class="cat-choice-label">この症例のカテゴリーを選んでください</div>
      <div class="cat-choice-row">${choiceHtml}</div>
      ${resultNoteHtml}
      ${sel.submitted ? '' : `<button class="btn btn-primary" id="caseSubmitBtn" style="margin-top:16px;" ${sel.picked?'':'disabled'}>回答を確定する</button>`}
      ${revealHtml}
      <div class="case-nav">
        <span class="case-nav-btn" id="caseBackBtn">← 一覧へ</span>
        <span style="flex:1;"></span>
        <span class="case-nav-btn" id="casePrevBtn" style="${currentCaseIdx===0?'visibility:hidden;':''}">前の症例</span>
        <span class="case-nav-btn" id="caseNextBtn" style="margin-left:8px; ${currentCaseIdx===CASES.length-1?'visibility:hidden;':''}">次の症例</span>
      </div>
    </div>
  `;

  document.getElementById('caseBackBtn').addEventListener('click', closeCaseDetail);
  const prevBtn = document.getElementById('casePrevBtn');
  const nextBtn = document.getElementById('caseNextBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(currentCaseIdx>0){ currentCaseIdx--; renderCaseDetail(); } });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(currentCaseIdx<CASES.length-1){ currentCaseIdx++; renderCaseDetail(); } });

  if(!sel.submitted){
    document.querySelectorAll('.cat-choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        sel.picked = Number(el.dataset.n);
        renderCaseDetail();
      });
    });
    const submitBtn = document.getElementById('caseSubmitBtn');
    if(submitBtn){
      submitBtn.addEventListener('click', ()=>{
        if(!sel.picked) return;
        sel.submitted = true;
        recordCaseAnswer(c.id, sel.picked===c.categoryNum);
        renderCaseDetail();
      });
    }
  }
}

/* ---------- start quiz ---------- */
document.getElementById('startBtn').addEventListener('click', startQuiz);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  let pool = filteredQuestions();
  if(pool.length===0){ alert('出題分野を1つ以上選んでください'); return; }
  pool = selectedOrder==='random' ? shuffle(pool) : pool.slice().sort((a,b)=>a.id.localeCompare(b.id));
  const n = selectedCount==='all' ? pool.length : Math.min(Number(selectedCount), pool.length);
  const questions = pool.slice(0,n);
  session = {questions, idx:0, answers: new Array(questions.length).fill(null), locked:false};

  document.getElementById('mcSetup').style.display='none';
  document.getElementById('mcResult').style.display='none';
  const quizEl = document.getElementById('mcQuiz');
  quizEl.style.display='block';
  brandSub.textContent = mode==='drill' ? 'DRILL MODE' : 'EXAM MODE';
  renderFilmstrip();
  renderQuestion();
}

function renderFilmstrip(){
  filmstrip.innerHTML='';
  session.questions.forEach((q,i)=>{
    const dot = document.createElement('i');
    if(i<session.idx) dot.className='done';
    else if(i===session.idx) dot.className='now';
    filmstrip.appendChild(dot);
  });
}

function renderQuestion(){
  const q = session.questions[session.idx];
  const isMulti = q.correct.length>1;
  const picked = session.answers[session.idx] ? new Set(session.answers[session.idx].picked) : new Set();
  const answered = !!session.answers[session.idx];

  const choiceKeys = ['a','b','c','d','e'];
  let choicesHtml = choiceKeys.map(k=>{
    if(!q.choices[k]) return '';
    let cls = 'choice';
    if(picked.has(k)) cls += ' selected';
    if(answered && (mode==='drill')){
      if(q.correct.includes(k)) cls += ' correct';
      else if(picked.has(k)) cls += ' wrong';
    }
    return `<div class="${cls}" data-k="${k}">
      <div class="mark">${k.toUpperCase()}</div>
      <div class="ctext">${q.choices[k]}</div>
    </div>`;
  }).join('');

  let feedbackHtml = '';
  if(answered && mode==='drill'){
    const correctSet = new Set(q.correct);
    const isCorrect = picked.size===correctSet.size && [...picked].every(k=>correctSet.has(k));
    feedbackHtml = `<div class="feedback ${isCorrect?'ok':'ng'}">
      <div class="fb-title">${isCorrect?'正解':'不正解 — 正解は '+q.correct.join(', ').toUpperCase()}</div>
      <div class="fb-body">${q.explanation||''}</div>
      ${q.reference? `<div class="fb-ref">出典: ${q.reference}</div>`:''}
    </div>`;
  }

  const isLast = session.idx===session.questions.length-1;

  document.getElementById('mcQuiz').innerHTML = `
    <div class="quiz-top">
      <div class="quiz-progress"><b>${session.idx+1}</b> / ${session.questions.length}</div>
      <div class="q-id">${q.id}</div>
    </div>
    <div class="card">
      <div class="tag-row">
        <div class="tag">${q.category}</div>
        <div class="tag sub">${q.subcategory}</div>
      </div>
      <div class="q-text">${q.question}</div>
      ${q.image_url ? `<div class="q-image-wrap"><img src="${q.image_url}" alt="症例画像" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><div class="q-image-error">画像を読み込めませんでした(リンク切れ、または共有設定をご確認ください)</div></div>` : ''}
      ${isMulti?`<div class="multi-note">※ ${q.correct.length}つ選べ</div>`:''}
      <div id="choicesWrap">${choicesHtml}</div>
      ${feedbackHtml}
      <div class="quiz-actions">
        <button class="btn btn-ghost btn-small" id="quitBtn">中断してホームへ</button>
        <button class="btn btn-primary" id="nextBtn" style="flex:1;" ${answered?'':'disabled'}>
          ${answered ? (isLast ? '結果を見る' : '次の問題へ') : (mode==='drill' ? '回答を確定する' : '回答して次へ')}
        </button>
      </div>
    </div>
  `;

  document.querySelectorAll('#choicesWrap .choice').forEach(el=>{
    el.addEventListener('click', ()=>{
      const existing = session.answers[session.idx];
      if(existing && existing.revealed) return; // locked only after the answer has been revealed/submitted
      const k = el.dataset.k;
      const cur = session.answers[session.idx] ? new Set(session.answers[session.idx].picked) : new Set();
      if(isMulti){
        cur.has(k) ? cur.delete(k) : cur.add(k);
      } else {
        cur.clear(); cur.add(k);
      }
      session.answers[session.idx] = {picked: cur, revealed:false};
      // re-render choices only (selection state) without full submit
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = cur.size===0;
      document.querySelectorAll('#choicesWrap .choice').forEach(c=>{
        c.classList.toggle('selected', cur.has(c.dataset.k));
      });
    });
  });

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', ()=>{
    const rec = session.answers[session.idx];
    if(!rec || rec.picked.size===0) return;
    if(mode==='drill' && !rec.revealed){
      rec.revealed = true;
      renderQuestion();
      return;
    }
    if(!rec.recorded){
      const correctSet = new Set(q.correct);
      const isCorrect = rec.picked.size===correctSet.size && [...rec.picked].every(k=>correctSet.has(k));
      recordAnswer(q.id, isCorrect);
      rec.recorded = true;
    }
    goNext();
  });

  document.getElementById('quitBtn').addEventListener('click', ()=>{
    if(confirm('中断してホームに戻りますか？回答内容は破棄されます。')) resetToSetup();
  });
}

function goNext(){
  if(session.idx < session.questions.length-1){
    session.idx++;
    renderFilmstrip();
    renderQuestion();
  } else {
    showResult();
  }
}

function resetToSetup(){
  session = null;
  document.getElementById('mcQuiz').style.display='none';
  document.getElementById('mcResult').style.display='none';
  document.getElementById('mcSetup').style.display='block';
  brandSub.textContent = 'STUDY DECK';
  filmstrip.innerHTML='';
  renderCatList();
  renderCountRow();
}

function showResult(){
  document.getElementById('mcQuiz').style.display='none';
  const resEl = document.getElementById('mcResult');
  resEl.style.display='block';

  let correctCount = 0;
  const catStats = {};
  const wrongList = [];

  session.questions.forEach((q,i)=>{
    const rec = session.answers[i];
    const picked = rec ? rec.picked : new Set();
    const correctSet = new Set(q.correct);
    const isCorrect = picked.size===correctSet.size && [...picked].every(k=>correctSet.has(k));
    if(isCorrect) correctCount++;
    if(!catStats[q.category]) catStats[q.category]={correct:0,total:0};
    catStats[q.category].total++;
    if(isCorrect) catStats[q.category].correct++;
    if(!isCorrect){
      wrongList.push({q, picked:[...picked]});
    }
  });

  const pct = Math.round((correctCount/session.questions.length)*100);

  const breakdownHtml = Object.keys(catStats).map(c=>{
    const s = catStats[c];
    const p = Math.round((s.correct/s.total)*100);
    return `<div class="breakdown-row">
      <div style="flex:none; width:150px; font-weight:600;">${c}</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${p}%;"></div></div>
      <div class="bnum">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  const reviewHtml = wrongList.length===0 ? `<div class="hint" style="margin-top:12px;">全問正解です。お見事です。</div>` :
    wrongList.map(({q,picked})=>{
      const yourAns = picked.length? picked.map(k=>k.toUpperCase()).join(', ') : '(未回答)';
      return `<div class="review-item">
        <div class="rq">${q.id} — ${q.question}</div>
        <div class="ranswer">あなたの回答: <span class="bad-a">${yourAns}</span> / 正解: <span class="good-a">${q.correct.join(', ').toUpperCase()}</span></div>
        <div class="rexp">${q.explanation||''}</div>
      </div>`;
    }).join('');

  resEl.innerHTML = `
    <div class="card score-hero">
      <div class="big">${correctCount}<span>/${session.questions.length}</span></div>
      <div class="label">正答率 ${pct}%</div>
    </div>
    <div class="card">
      <div class="section-label">分野別正答率</div>
      ${breakdownHtml}
    </div>
    <div class="card">
      <div class="section-label">見直し（${wrongList.length}問）</div>
      ${reviewHtml}
    </div>
    <button class="btn btn-primary" id="retryBtn">もう一度設定してやり直す</button>
  `;
  document.getElementById('retryBtn').addEventListener('click', resetToSetup);
  filmstrip.innerHTML='';
  session.questions.forEach(()=>{ const d=document.createElement('i'); d.className='done'; filmstrip.appendChild(d); });
}

/* ---------- progress dashboard ---------- */
function renderProgressTab(){
  const container = document.getElementById('progressContent');

  const dist = {new:0, weak:0, learning:0, mastered:0};
  QUESTIONS.forEach(q=>{ dist[masteryOf(q.id)]++; });

  let totalAttempts=0, totalCorrect=0;
  Object.values(progress).forEach(r=>{ totalAttempts+=r.attempts; totalCorrect+=r.correct; });
  Object.values(caseProgress).forEach(r=>{ totalAttempts+=r.attempts; totalCorrect+=r.correct; });
  const overallAcc = totalAttempts ? Math.round(totalCorrect/totalAttempts*100) : 0;

  if(totalAttempts===0){
    container.innerHTML = `
      <div class="card empty-tab">
        <div class="big-icon">📊</div>
        <h3>まだ演習データがありません</h3>
        <p>5択問題タブで問題を解くと、ここに分野別の習熟度が表示されます。</p>
      </div>
    `;
    return;
  }

  const heroHtml = `
    <div class="card">
      <div class="section-label">全体の学習状況</div>
      <div class="stat-hero">
        <div class="stat-box"><div class="snum">${totalAttempts}</div><div class="slabel">総回答数</div></div>
        <div class="stat-box"><div class="snum">${overallAcc}%</div><div class="slabel">累計正答率</div></div>
        <div class="stat-box"><div class="snum">${dist.mastered}</div><div class="slabel">習得済み問題</div></div>
      </div>
      <div class="count-row" style="margin-top:16px;">
        <span class="mastery-pill new">未挑戦 ${dist.new}</span>
        <span class="mastery-pill weak">苦手 ${dist.weak}</span>
        <span class="mastery-pill learning">学習中 ${dist.learning}</span>
        <span class="mastery-pill mastered">習得 ${dist.mastered}</span>
      </div>
    </div>
  `;

  const catOrder = [];
  const structure = {};
  QUESTIONS.forEach(q=>{
    if(!structure[q.category]){ structure[q.category]={}; catOrder.push(q.category); }
    if(!structure[q.category][q.subcategory]) structure[q.category][q.subcategory]=[];
    structure[q.category][q.subcategory].push(q);
  });

  let bodyHtml = '';
  catOrder.forEach(cat=>{
    const subs = structure[cat];
    let subRows = '';
    Object.keys(subs).forEach(sub=>{
      const qs = subs[sub];
      const total = qs.length;
      const masteredCount = qs.filter(qq=>masteryOf(qq.id)==='mastered').length;
      const weakCount = qs.filter(qq=>masteryOf(qq.id)==='weak').length;
      const pct = total ? Math.round(masteredCount/total*100) : 0;
      subRows += `
        <div class="subcat-row">
          <div class="subcat-top">
            <div class="subcat-name">${sub}</div>
            <div class="subcat-meta">${masteredCount}/${total} 習得${weakCount ? ` ・苦手${weakCount}` : ''}</div>
          </div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;"></div></div>
        </div>
      `;
    });
    const flat = Object.values(subs).flat();
    const catMastered = flat.filter(qq=>masteryOf(qq.id)==='mastered').length;
    bodyHtml += `
      <div class="card cat-block">
        <div class="cat-block-title"><span>${cat}</span><span class="subcat-meta">${catMastered}/${flat.length} 習得</span></div>
        ${subRows}
      </div>
    `;
  });

  let caseSectionHtml = '';
  if(CASES.length){
    const caseStructure = {};
    const caseSubOrder = [];
    CASES.forEach(c=>{
      if(!caseStructure[c.subcategory]){ caseStructure[c.subcategory]=[]; caseSubOrder.push(c.subcategory); }
      caseStructure[c.subcategory].push(c);
    });
    let caseSubRows = '';
    caseSubOrder.forEach(sub=>{
      const cs = caseStructure[sub];
      const total = cs.length;
      const masteredCount = cs.filter(cc=>caseMasteryOf(cc.id)==='mastered').length;
      const weakCount = cs.filter(cc=>caseMasteryOf(cc.id)==='weak').length;
      const pct = total ? Math.round(masteredCount/total*100) : 0;
      caseSubRows += `
        <div class="subcat-row">
          <div class="subcat-top">
            <div class="subcat-name">${sub}</div>
            <div class="subcat-meta">${masteredCount}/${total} 習得${weakCount ? ` ・苦手${weakCount}` : ''}</div>
          </div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;"></div></div>
        </div>
      `;
    });
    caseSectionHtml = `
      <div class="card cat-block">
        <div class="cat-block-title"><span>画像症例(カテゴリー判定)</span></div>
        ${caseSubRows}
      </div>
    `;
  }

  container.innerHTML = heroHtml + bodyHtml + caseSectionHtml + `
    <button class="btn btn-ghost" id="resetProgressBtn" style="margin-top:16px;">学習履歴をリセット</button>
  `;
  document.getElementById('resetProgressBtn').addEventListener('click', ()=>{
    if(confirm('これまでの正答・誤答の記録(5択問題・画像症例の両方)をすべて削除します。よろしいですか？')){
      progress = {};
      caseProgress = {};
      saveProgress();
      saveCaseProgress();
      renderProgressTab();
      renderCatList();
      renderCountRow();
    }
  });
}

/* init */
renderLevelRow();
renderCatList();
renderCountRow();
renderCaseList();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline caching unavailable, app still works */ });
  });
}
</script>
</body>
</html>
