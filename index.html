<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>マンモグラフィ認定試験対策 | STUDY DECK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBEEF3;
    --bg-deep: #F6DCE7;
    --panel: #FFFFFF;
    --ink: #2B1420;
    --ink-soft: #7A5A66;
    --pink-900: #A21556;
    --pink-700: #C21A66;
    --pink-500: #E0367F;
    --pink-200: #F6D2E1;
    --pink-100: #FCE9F1;
    --line: #F0C9D9;
    --green: #1E8E5A;
    --green-bg: #E4F5EC;
    --red: #D3324A;
    --red-bg: #FCE7EA;
    --amber: #B8720B;
    --amber-bg: #FCEFDA;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --shadow: 0 10px 30px -14px rgba(162,21,86,0.28);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family:"Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    min-height:100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 100% 0%, rgba(224,54,127,0.10), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(162,21,86,0.08), transparent 45%);
    padding-bottom: 48px;
  }

  .heading{ font-family:"Zen Kaku Gothic New", "Noto Sans JP", sans-serif; }
  .mono{ font-family:"Space Mono", monospace; letter-spacing:0.08em; }

  /* ---------- shell ---------- */
  .app{
    max-width: 560px;
    margin: 0 auto;
    padding: 22px 18px 0;
  }

  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }
  .topbar h1{
    font-size: 1.5rem;
    line-height:1.3;
    margin:0;
    font-weight:900;
    color: var(--pink-900);
  }
  .topbar h1 span{ color: var(--pink-500); }
  .eyebrow{
    font-size: 0.66rem;
    color: var(--ink-soft);
    letter-spacing: 0.18em;
    white-space:nowrap;
    padding-top:4px;
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:grid; grid-template-columns: 1.15fr 1fr 0.8fr;
    gap:8px;
    margin-bottom: 18px;
  }
  .tab{
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 6px 11px;
    text-align:center;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
    user-select:none;
  }
  .tab .t-main{ font-weight:700; font-size:0.95rem; }
  .tab .t-sub{ font-size:0.68rem; color: var(--ink-soft); margin-top:2px; }
  .tab.active{
    background: var(--pink-700);
    border-color: var(--pink-700);
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }
  .tab.active .t-main{ color:#fff; }
  .tab.active .t-sub{ color: rgba(255,255,255,0.82); }
  .tab:not(.active):active{ transform: scale(0.98); }
  .tab.disabled{ opacity:0.55; cursor:default; }

  /* ---------- panel ---------- */
  .panel{
    background: var(--panel);
    border-radius: 26px;
    padding: 22px 18px 26px;
    box-shadow: 0 18px 40px -24px rgba(162,21,86,0.35);
    border: 1px solid #FBE4ED;
  }

  .section-title{
    display:flex; align-items:center; gap:10px;
    font-weight:700; font-size:0.92rem; color: var(--pink-900);
    margin: 0 0 12px;
  }
  .section-title::after{
    content:""; flex:1; height:1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }
  .section-title .tick{
    width:6px; height:6px; border-radius:2px;
    background: var(--pink-500); transform: rotate(45deg);
    flex-shrink:0;
  }

  /* mode cards */
  .modes{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:22px; }
  .mode-card{
    border-radius: var(--radius-md);
    border: 1.6px solid var(--line);
    padding: 14px 13px;
    cursor:pointer;
    transition: all .12s ease;
    background: var(--pink-100);
  }
  .mode-card h3{ margin:0 0 6px; font-size:0.96rem; font-weight:700; }
  .mode-card p{ margin:0; font-size:0.72rem; line-height:1.5; color: var(--ink-soft); }
  .mode-card.selected{
    border-color: var(--pink-700);
    background: var(--pink-200);
    box-shadow: 0 6px 16px -8px rgba(162,21,86,0.4);
  }
  .mode-card.selected h3{ color: var(--pink-900); }

  /* category list */
  .cat-head-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .link-btn{
    background:none; border:none; color:var(--pink-700); font-size:0.72rem;
    font-weight:700; cursor:pointer; padding:4px 2px;
  }
  .cat-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
  .cat-item{
    display:flex; align-items:center; gap:12px;
    border: 1.6px solid var(--line);
    border-radius: 14px;
    padding: 11px 13px;
    cursor:pointer;
    transition: all .12s ease;
    background:#fff;
  }
  .cat-item.checked{ border-color: var(--pink-700); background: var(--pink-100); }
  .box{
    width:22px; height:22px; border-radius:7px;
    border:1.8px solid #E3AFC5;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition: all .12s ease;
    background:#fff;
  }
  .cat-item.checked .box{ background: var(--pink-700); border-color: var(--pink-700); }
  .box svg{ width:13px; height:13px; opacity:0; transform: scale(0.6); transition: all .1s ease; }
  .cat-item.checked .box svg{ opacity:1; transform: scale(1); }
  .cat-name{ flex:1; font-size:0.86rem; font-weight:600; }
  .cat-count{ font-size:0.76rem; color: var(--ink-soft); font-weight:600; }
  .cat-item.checked .cat-count{ color: var(--pink-700); }

  .total-line{
    font-size:0.74rem; color: var(--ink-soft); margin: 10px 2px 22px;
  }
  .total-line b{ color: var(--pink-900); }

  /* mastery filter chips */
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .chip{
    border:1.6px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-size:0.76rem; font-weight:700;
    cursor:pointer; background:#fff; color: var(--ink-soft);
    display:flex; align-items:center; gap:6px;
    transition: all .12s ease;
  }
  .chip .dot{ width:7px; height:7px; border-radius:50%; }
  .chip[data-k="unseen"] .dot{ background:#B9A0AC; }
  .chip[data-k="wrong"] .dot{ background: var(--red); }
  .chip[data-k="correct"] .dot{ background: var(--green); }
  .chip.on{ border-color: var(--pink-700); color: var(--pink-900); background: var(--pink-100); }

  /* count stepper */
  .count-row{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .count-opt{
    flex:1; text-align:center; border:1.6px solid var(--line); border-radius:12px;
    padding:10px 4px; font-weight:700; font-size:0.82rem; cursor:pointer; background:#fff;
    color: var(--ink-soft);
  }
  .count-opt.on{ border-color: var(--pink-700); background: var(--pink-700); color:#fff; }

  .start-btn{
    width:100%; border:none; border-radius:16px;
    background: linear-gradient(135deg, var(--pink-700), var(--pink-900));
    color:#fff; font-weight:700; font-size:1rem;
    padding:16px; cursor:pointer;
    box-shadow: 0 14px 26px -12px rgba(162,21,86,0.55);
    transition: transform .1s ease;
    font-family: inherit;
  }
  .start-btn:active{ transform: scale(0.98); }
  .start-btn:disabled{
    background:#DCC3CE; box-shadow:none; cursor:not-allowed;
  }
  .start-hint{ text-align:center; font-size:0.7rem; color:var(--ink-soft); margin-top:10px; }

  /* ---------- placeholder (image cases) ---------- */
  .placeholder{
    text-align:center; padding: 54px 20px 44px;
  }
  .placeholder .ph-icon{
    width:64px;height:64px;margin:0 auto 18px;
    border-radius:18px; background: var(--pink-100);
    display:flex; align-items:center; justify-content:center;
    border: 1.6px dashed #E3AFC5;
  }
  .placeholder h3{ margin:0 0 8px; color:var(--pink-900); font-size:1.05rem; }
  .placeholder p{ margin:0; font-size:0.82rem; color:var(--ink-soft); line-height:1.7; }

  /* ---------- progress tab ---------- */
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:22px; }
  .stat-card{
    border-radius:16px; padding:14px 16px; background: var(--pink-100);
    border: 1.4px solid var(--line);
  }
  .stat-card .num{ font-size:1.5rem; font-weight:900; color:var(--pink-900); font-family:"Zen Kaku Gothic New",sans-serif; }
  .stat-card .lbl{ font-size:0.68rem; color:var(--ink-soft); margin-top:2px; font-weight:600; }

  .cat-prog-row{ margin-bottom:14px; }
  .cat-prog-top{ display:flex; justify-content:space-between; font-size:0.78rem; margin-bottom:6px; }
  .cat-prog-top .name{ font-weight:700; }
  .cat-prog-top .frac{ color:var(--ink-soft); font-family:"Space Mono",monospace; font-size:0.72rem;}
  .bar-track{ height:9px; border-radius:99px; background:#F2DAE5; overflow:hidden; display:flex; }
  .bar-fill-correct{ height:100%; background: var(--green); }
  .bar-fill-wrong{ height:100%; background: var(--red); }

  .reset-row{ text-align:center; margin-top:20px; }
  .reset-row button{
    background:none; border:1.4px solid var(--line); color:var(--ink-soft);
    padding:9px 16px; border-radius:12px; font-size:0.74rem; cursor:pointer; font-family:inherit;
  }

  /* ---------- quiz view ---------- */
  .quiz-wrap{ display:none; }
  .quiz-wrap.active{ display:block; }
  .setup-wrap.hidden, .progress-wrap.hidden, .imgcase-wrap.hidden{ display:none; }

  .quiz-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .quiz-close{
    background:var(--pink-100); border:1.4px solid var(--line); color:var(--pink-900);
    width:34px;height:34px;border-radius:11px; font-size:1.1rem; cursor:pointer;
    display:flex;align-items:center;justify-content:center; font-family:inherit;
  }
  .quiz-progress-txt{ font-size:0.78rem; font-weight:700; color:var(--ink-soft); font-family:"Space Mono",monospace;}
  .quiz-bar-track{ height:6px; background:#F2DAE5; border-radius:99px; overflow:hidden; margin-bottom:18px;}
  .quiz-bar-fill{ height:100%; background: linear-gradient(90deg,var(--pink-500),var(--pink-700)); transition: width .25s ease; }

  .q-cat-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.68rem; font-weight:700; color:var(--pink-700);
    background: var(--pink-100); border-radius:99px; padding:5px 11px; margin-bottom:12px;
  }
  .q-multi-tag{
    display:inline-flex; font-size:0.68rem; font-weight:700; color:var(--amber);
    background: var(--amber-bg); border-radius:99px; padding:5px 11px; margin-bottom:12px; margin-left:6px;
  }
  .q-text{ font-size:1.02rem; font-weight:700; line-height:1.65; margin: 0 0 18px; color:var(--ink); }

  .choice-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .choice{
    display:flex; align-items:flex-start; gap:12px;
    border: 1.6px solid var(--line); border-radius:14px;
    padding: 13px 14px; cursor:pointer; background:#fff;
    transition: all .12s ease;
  }
  .choice-mark{
    width:24px;height:24px; border-radius:50%; border:1.8px solid #E3AFC5;
    flex-shrink:0; display:flex;align-items:center;justify-content:center;
    font-size:0.72rem; font-weight:700; color:#B9899E;
    font-family:"Space Mono",monospace;
    transition: all .12s ease;
  }
  .choice.multi .choice-mark{ border-radius:7px; }
  .choice-text{ font-size:0.87rem; line-height:1.55; padding-top:1px; }
  .choice.selected{ border-color: var(--pink-700); background: var(--pink-100); }
  .choice.selected .choice-mark{ background:var(--pink-700); border-color:var(--pink-700); color:#fff; }

  .choice.correct{ border-color: var(--green); background: var(--green-bg); }
  .choice.correct .choice-mark{ background: var(--green); border-color:var(--green); color:#fff; }
  .choice.incorrect{ border-color: var(--red); background: var(--red-bg); }
  .choice.incorrect .choice-mark{ background: var(--red); border-color:var(--red); color:#fff; }
  .choice.locked{ cursor:default; }

  .exp-box{
    border-radius:16px; padding:15px 16px; margin-bottom:18px;
    border:1.6px solid; font-size:0.83rem; line-height:1.7;
  }
  .exp-box.ok{ background: var(--green-bg); border-color:#BFE4CD; color:#155C3B; }
  .exp-box.ng{ background: var(--red-bg); border-color:#F3C1CA; color:#8E2233; }
  .exp-box .exp-head{ font-weight:700; font-size:0.86rem; margin-bottom:6px; display:flex; align-items:center; gap:6px;}

  .quiz-actions{ display:flex; gap:10px; }
  .btn{
    border:none; border-radius:14px; padding:14px; font-weight:700; font-size:0.9rem;
    cursor:pointer; font-family:inherit; flex:1;
  }
  .btn-primary{ background: var(--pink-700); color:#fff; }
  .btn-primary:disabled{ background:#DCC3CE; cursor:not-allowed; }
  .btn-ghost{ background:var(--pink-100); color:var(--pink-900); border:1.4px solid var(--line); }

  /* ---------- result view ---------- */
  .result-wrap{ display:none; }
  .result-wrap.active{ display:block; }
  .result-hero{ text-align:center; padding: 8px 6px 24px; }
  .result-ring{
    width:132px;height:132px; margin:0 auto 16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .result-ring svg{ position:absolute; top:0; left:0; transform:rotate(-90deg); }
  .result-ring .rr-num{ font-size:1.9rem; font-weight:900; color:var(--pink-900); font-family:"Zen Kaku Gothic New",sans-serif; position:relative; }
  .result-ring .rr-sub{ font-size:0.65rem; color:var(--ink-soft); position:relative; margin-top:2px; }
  .result-hero h2{ margin:0 0 6px; font-size:1.15rem; color:var(--pink-900); }
  .result-hero p{ margin:0; font-size:0.8rem; color:var(--ink-soft); }

  .review-item{
    border:1.6px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px;
  }
  .review-item.wrong{ border-color:#F3C1CA; background:#FFF7F8; }
  .review-item.right{ border-color:#BFE4CD; background:#F7FCF9; }
  .review-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .review-tag{ font-size:0.66rem; font-weight:700; padding:3px 9px; border-radius:99px; }
  .review-item.wrong .review-tag{ background:var(--red-bg); color:var(--red); }
  .review-item.right .review-tag{ background:var(--green-bg); color:var(--green); }
  .review-q{ font-size:0.83rem; font-weight:700; margin-bottom:6px; line-height:1.55;}
  .review-detail{ font-size:0.76rem; color:var(--ink-soft); line-height:1.6; }
  .review-detail .lbl{ font-weight:700; color:var(--ink); }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--ink); color:#fff; padding:11px 20px; border-radius:12px;
    font-size:0.8rem; opacity:0; pointer-events:none; transition: all .25s ease;
    z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:380px){
    .modes{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ===== header ===== -->
  <div class="topbar">
    <h1 class="heading">マンモグラフィ<span>認定試験対策</span></h1>
    <div class="eyebrow mono">STUDY DECK</div>
  </div>

  <!-- ===== tabs ===== -->
  <div class="tabs">
    <div class="tab active" data-tab="quiz">
      <div class="t-main">5択問題</div>
      <div class="t-sub mono" id="tabQuizCount">全305問</div>
    </div>
    <div class="tab" data-tab="imgcase">
      <div class="t-main">画像症例</div>
      <div class="t-sub">準備中</div>
    </div>
    <div class="tab" data-tab="progress">
      <div class="t-main">進捗</div>
      <div class="t-sub">&nbsp;</div>
    </div>
  </div>

  <div class="panel">

    <!-- ================= SETUP ================= -->
    <div class="setup-wrap" id="setupWrap">

      <div class="section-title"><span class="tick"></span>モード</div>
      <div class="modes">
        <div class="mode-card selected" id="modePractice">
          <h3>演習モード</h3>
          <p>1問ずつ回答→即座に正誤と解説を確認</p>
        </div>
        <div class="mode-card" id="modeExam">
          <h3>模擬試験モード</h3>
          <p>最後まで解いてから採点・解説をまとめて確認</p>
        </div>
      </div>

      <div class="cat-head-row">
        <div class="section-title" style="margin-bottom:0; flex:1;"><span class="tick"></span>出題分野</div>
      </div>
      <div style="display:flex; justify-content:flex-end; margin: -6px 0 10px;">
        <button class="link-btn" id="selectAllBtn">すべて選択</button>
      </div>
      <div class="cat-list" id="catList"></div>
      <div class="total-line" id="totalLine"></div>

      <div class="section-title"><span class="tick"></span>習熟度で絞る</div>
      <div class="chip-row" id="chipRow">
        <div class="chip on" data-k="unseen"><span class="dot"></span>未回答</div>
        <div class="chip on" data-k="wrong"><span class="dot"></span>要復習</div>
        <div class="chip on" data-k="correct"><span class="dot"></span>習得済み</div>
      </div>

      <div class="section-title"><span class="tick"></span>出題数</div>
      <div class="count-row" id="countRow">
        <div class="count-opt" data-n="10">10問</div>
        <div class="count-opt" data-n="20">20問</div>
        <div class="count-opt" data-n="30">30問</div>
        <div class="count-opt on" data-n="all">全問</div>
      </div>

      <button class="start-btn" id="startBtn">この条件で開始する</button>
      <div class="start-hint" id="startHint"></div>
    </div>

    <!-- ================= IMAGE CASES (placeholder) ================= -->
    <div class="imgcase-wrap hidden" id="imgcaseWrap">
      <div class="placeholder">
        <div class="ph-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#C21A66" stroke-width="1.6"/><circle cx="9" cy="9" r="1.6" fill="#C21A66"/><path d="M3 16l5-5 4 4 3-3 6 6" stroke="#C21A66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h3 class="heading">画像症例は準備中です</h3>
        <p>マンモグラフィ画像を用いた読影トレーニングは近日追加予定です。<br>しばらくお待ちください。</p>
      </div>
    </div>

    <!-- ================= PROGRESS ================= -->
    <div class="progress-wrap hidden" id="progressWrap">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="num" id="statAnswered">0</div>
          <div class="lbl">回答済み問題数</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statAccuracy">–</div>
          <div class="lbl">通算正答率</div>
        </div>
      </div>
      <div class="section-title"><span class="tick"></span>分野別の習熟度</div>
      <div id="catProgList"></div>
      <div class="reset-row"><button id="resetProgressBtn">学習履歴をリセット</button></div>
    </div>

    <!-- ================= QUIZ ================= -->
    <div class="quiz-wrap" id="quizWrap">
      <div class="quiz-top">
        <button class="quiz-close" id="quizCloseBtn">✕</button>
        <div class="quiz-progress-txt" id="quizProgressTxt">1 / 20</div>
      </div>
      <div class="quiz-bar-track"><div class="quiz-bar-fill" id="quizBarFill" style="width:5%"></div></div>

      <div>
        <span class="q-cat-tag" id="qCatTag">分野</span>
        <span class="q-multi-tag" id="qMultiTag" style="display:none;">2つ選べ</span>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="choice-list" id="choiceList"></div>

      <div id="expBox"></div>

      <div class="quiz-actions">
        <button class="btn btn-primary" id="answerBtn" disabled>回答する</button>
      </div>
    </div>

    <!-- ================= RESULT ================= -->
    <div class="result-wrap" id="resultWrap">
      <div class="result-hero">
        <div class="result-ring" id="resultRing">

:"A領域を写したい時、SIO方向で追加撮影する。接線撮影は乳房の中心にあるものに適さない。","img":"","tags":"LMO撮影;SIO撮影;接線撮影;スポット撮影"},{"id":"AS-16","cat":"追加撮影","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"乳房上部の描出にはSIO撮影をする。"},{"k":"b","t":"接線撮影は体表近くの腫瘤に効果的である。"},{"k":"c","t":"FB撮影は下部の病変部の描出に有効である。"},{"k":"d","t":"標準撮影で外側が欠けた場合の追加撮影はXCC撮影だけで良い。"},{"k":"e","t":"マンモトームになりそうな集簇性の石灰化はLM、拡大撮影を追加する。"}],"ans":["c","d"],"exp":"FB撮影は上部の病変部の描出に有効である。ポジショニング不良や補正のための追加撮影をしてはいけない。","img":"","tags":"SIO撮影;接線撮影;FB撮影;XCC撮影;石灰化"},{"id":"AS-17","cat":"追加撮影","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"外側の追加撮影はXCC撮影のみで良い。"},{"k":"b","t":"FB撮影は上部に mass があるものに使用する。"},{"k":"c","t":"CV撮影は乳房内側前方の深部を撮影する方法である。"},{"k":"d","t":"接線撮影は乳腺組織から外し、脂肪組織に投影する方法である。"},{"k":"e","t":"AT撮影は乳房外側と腋窩の全域を描出するための撮影法である。"}],"ans":["a","c"],"exp":"外側の追加撮影はXCC 撮影のみで良いわけではない。CV撮影は乳房内側後方の深部を撮影する方法である。","img":"","tags":"XCC撮影;FB撮影;CV撮影;接線撮影;AT撮影"},{"id":"AS-18","cat":"追加撮影","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"LM撮影は inframammary fold が伸びていれば適正である。"},{"k":"b","t":"ML撮影は乳房内側の病変を描出するのに有効な方法である。"},{"k":"c","t":"XCC撮影は乳房外側が照射野に入るまで受診者を回転させる。"},{"k":"d","t":"90℃側面撮影はMLO、CC両方に異常を認める場合に追加する。"},{"k":"e","t":"腋窩撮影は上腕と肋骨を入れて腋窩部が広く全体に入るように撮影する。"}],"ans":["b","d"],"exp":"ML撮影は乳房外側の病変を描出するのに有効な方法である。90℃側面撮影はMLO、CCのどちらか一方だけに異常が認める場合に追加する。","img":"","tags":"LM撮影;ML撮影;XCC撮影;側面撮影;腋窩撮影"},{"id":"AS-19","cat":"追加撮影","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"腫瘤性病変には拡大スポット撮影は行わない。"},{"k":"b","t":"LM撮影は体が傾斜したり、乳房をロールしないように注意する。"},{"k":"c","t":"拡大撮影では胸壁付近の欠損が多くなるので、CCを撮影しない。"},{"k":"d","t":"密着スポット撮影は全体撮影よりコントラストが大幅に増強される。"},{"k":"e","t":"接線撮影は腫瘤の存在診断、鑑別診断上最も有効といわれる追加撮影である。"}],"ans":["a","c"],"exp":"腫瘤性病変でも腫瘤自体が微小である場合は、積極的に拡大スポット撮影は行なう。CC方向でも拡大撮影を行う。","img":"","tags":"拡大スポット撮影;LM撮影;拡大撮影;スポット撮影;接線撮影"},{"id":"AS-20","cat":"追加撮影","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"LMO撮影は胸壁近くまで撮影が可能である。"},{"k":"b","t":"ML撮影は inframammary fold が伸びていれば適正である。"},{"k":"c","t":"CR、S/Fともに近接撮影より拡大撮影の方が分解能は悪くなる。"},{"k":"d","t":"拡大スポット撮影は拡大率が高くなるに従い、照射野は広く  カテゴリー 2"},{"k":"b","t":"高濃度乳房 カテゴリー 1"},{"k":"c","t":"構築の乱れ カテゴリー 5"},{"k":"d","t":"圧迫スポット・拡大撮影 カテゴリー 3"},{"k":"e","t":"細胞診や生検も含めた精査 カテゴリー 4"}],"ans":["c"],"exp":"構築の乱れは手術瘢痕に一致するものはカテゴリー2、手術瘢痕のないものはカテゴリー4である。","img":"","tags":"豊胸術;高濃度乳房;構築の乱れ;精査"},{"id":"AS-07","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。","choices":[{"k":"a","t":"鋳型状石灰化は良性疾患にはみられない。"},{"k":"b","t":"特有の石灰化は栄養血管を持たない。"},{"k":"c","t":"DCISに伴う微小石灰化は基本的に一つの腺葉系に分布する。"},{"k":"d","t":"石灰化の集簇の定義としてACRでは2ccをその範囲の目安としている。"},{"k":"e","t":"腫瘤がMLO撮影ではニップルより少し上、CC撮影では内側にあればA領域に存在する。"}],"ans":["e"],"exp":"腫瘤がMLO撮影ではニップルより少し上、CC撮影では内側にあればB領域に存在する。","img":"","tags":"石灰化;DCIS;ACR;領域診断"},{"id":"AS-08","cat":"腫瘤と石灰化","q":"石灰化について誤っているのはどれか。","choices":[{"k":"a","t":"分泌型石灰化は良性である。"},{"k":"b","t":"分泌型の石灰化は1mm以下である。"},{"k":"c","t":"動脈硬化による石灰化は間質型である。"},{"k":"d","t":"壊死型の石灰化は2~3mm程度である。"},{"k":"e","t":"乳管内に収まらない石灰化は良性である。"}],"ans":["a"],"exp":"分泌型石灰化は良性、悪性にもある。","img":"","tags":"石灰化;分泌型;壊死型;間質型"},{"id":"AS-09","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。","choices":[{"k":"a","t":"悪性葉状腫瘍は間質型の石灰化を伴う。"},{"k":"b","t":"分泌型石灰化は老廃物による石灰化である。"},{"k":"c","t":"鋳型石灰化は悪性を示唆する石灰化である。"},{"k":"d","t":"ポップコーン石灰化は退縮した嚢胞に見られる。"},{"k":"e","t":"高濃度乳房で乳腺内の有無を確認するときはカテゴリー1とする。"}],"ans":["d"],"exp":"ポップコーン石灰化は退縮した線維腺腫に見られる。","img":"","tags":"悪性葉状腫瘍;分泌型;鋳型石灰化;線維腺腫"},{"id":"AS-10","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。","choices":[{"k":"a","t":"異栄養性石灰化は良性でも生じる。"},{"k":"b","t":"硬化性腺症は分泌型の石灰化を伴う。"},{"k":"c","t":"石灰化のパターンによって悪性度は決定できない。"},{"k":"d","t":"多形性、微細線状で集簇性示す石灰化は悪性を疑う。"},{"k":"e","t":"密度の高い広がりが集簇の範囲を超えた場合には領域性と判断する。"}],"ans":["e"],"exp":"密度の高い広がりが集簇の範囲を超えた場合には区域性と判断する。","img":"","tags":"異栄養性石灰化;硬化性腺症;悪性度;集簇"},{"id":"AS-11","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"乳房の構成は読影の信頼度を示すものである。"},{"k":"b","t":"乳管内に浸潤した癌は微細石灰化として抽出される。"},{"k":"c","t":"線状に広がる中心透亮性の石灰化はカテゴリー4である。"},{"k":"d","t":"腫瘤の辺縁が一部乳腺と重なっていたため、評価困難とした。"},{"k":"e","t":"脂肪濃度を含まないコア (芯)のある腫瘤はカテゴリー3である。"}],"ans":["c","e"],"exp":"線状に広がる中心透亮性の石灰化はカテゴリー2である。脂肪濃度を含まないコア (芯)のある腫瘤はカテゴリー4である。","img":"","tags":"読影;石灰化;カテゴリー判定;腫瘤"},{"id":"AS-12","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"カテゴリー N-2は再撮影を必要とする。"},{"k":"b","t":"カテゴリーNとは読影不能のことである。"},{"k":"c","t":"中心透亮性石灰化で集簇性の場合、カテゴリー3以上である。"},{"k":"d","t":"カテゴリー3とは良性であるが、悪性を否定できないものをいう。"},{"k":"e","t":"脂肪性濃度にスピキュラ、中心に核があるのをカテゴリー5とした。"}],"ans":["a","c"],"exp":"カテゴリーN-2は再検しても有効でないもの。中心透亮性石灰化はカテゴリー2である。","img":"","tags":"カテゴリー;読影不能;石灰化"},{"id":"AS-13","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"50歳代のほとんどは脂肪性である。"},{"k":"b","t":"鋳型石灰化は面疱型壊死によるものである。"},{"k":"c","t":"辺縁の追える腫瘤の内部に脂肪を含む腫瘤をカテゴリー3とした。"},{"k":"d","t":"点状石灰化が線状に分布すると少なくともカテゴリー3以上はつける。"},{"k":"e","t":"脂肪性の乳房に境界明瞭平滑な高濃度の腫瘤を認めたため、カテゴリー4とした。"}],"ans":["a","c"],"exp":"50歳代の約10%は脂肪性である。辺縁の追える腫瘤の内部に脂肪を含む腫瘤はカテゴリー2である。","img":"","tags":"年齢;石灰化;腫瘤;カテゴリー判定"},{"id":"AS-14","cat":"腫瘤と石灰化","q":"読影について誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"微細分枝状石灰化の集族性をカテゴリー5とした。"},{"k":"b","t":"脂肪の乳房の中に辺縁明瞭な腫瘤があり、カテゴリー3とした。"},{"k":"c","t":"両側にびまん性に多形成不均一な石灰化を認め、カテゴリー2とした。"},{"k":"d","t":"嚢胞内乳頭腫は境界明瞭な腫瘤像を示すため、カテゴリー3に分類する。"},{"k":"e","t":"区域性に分布する中心透亮性の石灰化がみられたのでカテゴリー2とした。"}],"ans":["c","d"],"exp":"両側にびまん性に多形成不均一な石灰化はカテゴリー3である（または個別の状況による）。嚢胞内乳頭腫はケースによっては高濃度の場合カテゴリー4とする。","img":"","tags":"石灰化;カテゴリー判定;嚢胞内乳頭腫"},{"id":"AS-15","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"点状石灰化が線状に分布すると、少なくともカテゴリー3以上はつける。"},{"k":"b","t":"非常に萎縮した乳腺に境界明瞭の腫瘤を認めたため、カテゴリー5とした。"},{"k":"c","t":"FADの時、濃度勾配が均一で等濃度～高濃度の場合、カテゴリー3とする。"},{"k":"d","t":"高濃度乳房で乳腺内の病変の有無が確認しずらいときは、カテゴリー3とする。"},{"k":"e","t":"乳房内リンパ節が認められ、内部に石灰化が見られるときはカテゴリー2である。"}],"ans":["b","d"],"exp":"非常に萎縮した乳腺でも境界明瞭な良性腫瘤はカテゴリー2または3。確認しづらい場合はカテゴリー1（または状況による）。","img":"","tags":"石灰化;カテゴリー判定;高濃度乳房"},{"id":"AS-16","cat":"腫瘤と石灰化","q":"次のうち誤っているのはどれか。2つ選べ。","choices":[{"k":"a","t":"50歳代の60%は脂肪性である。"},{"k":"b","t":"不均一高濃度は乳腺組織が60%程度である。"},{"k":"c","t":"MMGで病変を良く描出できるのは不均一高濃度である。"},{"k":"d","t":"乳房の構成の記載は病変が正常乳腺に隠されてしまう危険性の程度を示すものである。"},{"k":"e","t":"カテゴリー N-1とは、体動、撮影条件不良やポジショニング不良などにより再 ","t":"0.2mmのアルミニウム板を使用し、AECを設定する。"},{"k":"e","t":"乳房支持台に向かって右側にアルミニウム板を配置する。"}],"ans":["c","e"],"exp":"ROI中の画素値の平均値と標準偏差を求める。乳房支持台に向かって右側にアルミニウム板を配置する。","img":"","tags":"品質管理;AEC;CNR;デジタルシステム"},{"id":"QM2-15","cat":"解剖生理","q":"誤っているのはどれか。すべて選べ。","choices":[{"k":"a","t":"腺房が集まって小葉になる。"},{"k":"b","t":"小葉が集まって腺葉になる。"},{"k":"c","t":"乳腺組織は10~15個の乳腺葉に分かれる。"},{"k":"d","t":"TDLUとは小葉と小葉外終末乳管を合わせものをいう。"},{"k":"e","t":"乳管は乳管上皮細胞と筋上皮細胞の二層でできている。"}],"ans":["c"],"exp":"乳腺組織は15~25個の乳腺葉に分かれる。","img":"","tags":"乳腺;解剖;組織;乳管"},{"id":"QM2-16","cat":"病理","q":"正しいのはどれか。すべて選べ。","choices":[{"k":"a","t":"分泌型石灰化は乳腺症にもみられる。"},{"k":"b","t":"浸潤性小葉癌は希少がんではない。"},{"k":"c","t":"乳癌の石灰化は壊死型と分泌型に分かれる。"},{"k":"d","t":"分泌型石灰化はその形態で悪性度がわかる。"},{"k":"e","t":"非浸潤癌は大きさに関係なく早期乳癌である。"}],"ans":["a","c"],"exp":"分泌型石灰化は乳腺症にもみられる。乳癌の石灰化は壊死型と分泌型に分かれる。","img":"","tags":"乳癌;石灰化;病理;希少がん"},{"id":"QM2-17","cat":"臨床","q":"正しいのはどれか。すべて選べ。","choices":[{"k":"a","t":"病期は0期から4期まである。"},{"k":"b","t":"しこりのない炎症性乳癌は1期である。"},{"k":"c","t":"他臓器に転移していたらステージ4である。"},{"k":"d","t":"乳癌の治療方針は病期(ステージ)によって決まる。"},{"k":"e","t":"病期はしこりの大きさとリンパ節転移の2つによって決まる。"}],"ans":["a","c"],"exp":"炎症性乳癌は T4 である。3B 期から含まれる。 乳癌の治療方針は癌の進行の程度を示すステージ(病期)や癌の性質、体の状態などに基づいて検討する。病期はしこりの大きさ、リンパ節への転移状況、他の臓器への転移の有無の 3 つの要素によって決まる。","img":"","tags":"乳癌;ステージ;病期;臨床"},{"id":"QM2-18","cat":"乳癌検診","q":"乳癌検診について誤っているのはどれか。すべて選べ。","choices":[{"k":"a","t":"異常なしと分かることは利益である。"},{"k":"b","t":"病変がないと分かることで安心するのは利益である。"},{"k":"c","t":"生命予後に関係ないものが見つかることは利益である。"},{"k":"d","t":"生命に影響しないような癌が見つかることは不利益である。"},{"k":"e","t":"検診で早期発見や早期治療によって死亡率が減少するのは利益である。"}],"ans":["c"],"exp":"生命予後に関係ないものが見つかることは不利益(過剰診断)である。","img":"","tags":"検診;利益;不利益;過剰診断"},{"id":"QM2-19","cat":"標準撮影","q":"撮影について正しいのはどれか。すべて選べ。","choices":[{"k":"a","t":"標準撮影では病変に特化した撮影方法を用いてよい。"},{"k":"b","t":"密着撮影より拡大撮影のほうが低圧迫の必要がある。"},{"k":"c","t":"乳腺の圧迫は少なくとも100N以上必要である。"},{"k":"d","t":"乳腺の伸展には技術者の手技が必要で圧迫板で伸展しない。"},{"k":"e","t":"通常撮影法はそれを補完するような撮影を追加することも許容されている。"}],"ans":["d"],"exp":"標準撮影では病変に特化した撮影方法を用いない。CC 撮影と MLO 撮影。密着撮影より拡大撮影のほうを低圧迫にする必要はない。 補完するような撮影の追加を許容しない。明確な目的が必要である。","img":"","tags":"標準撮影;撮影技術;圧迫;伸展"},{"id":"QM2-20","cat":"腫瘤と石灰化","q":"正しいのはどれか。すべて選べ。","choices":[{"k":"a","t":"60歳代のほとんどが脂肪性である。"},{"k":"b","t":"区域性の石灰化は腺葉に沿ってできたものである。"},{"k":"c","t":"石灰化で一腺葉に分布するものは良性の可能性が高い。"},{"k":"d","t":"中心透亮性の石灰化が両側に多発している場合はカテゴリー2である。"},{"k":"e","t":"石灰化がCCで点状に見えたが、MLOでは微細線状に見えたらカテゴリー4である。"}],"ans":["b","d"],"exp":"60 歳代の約 30 %が脂肪性である。腺葉または区域性に乳癌が広がっている可能性を示唆する。石灰化が CC で点状に見えたが、MLO では微細線状に見えたらカテゴリー 5 である。","img":"","tags":"石灰化;カテゴリー分類;良性;悪性"}]
;

const CATEGORIES = [...new Set(QUESTIONS.map(q => q.cat))];
const STORAGE_KEY = "mammoStudyDeck.v1";

/* =========================================================
   STATE / STORAGE
   ========================================================= */
function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { results: {} }; // results[id] = {status:'correct'|'wrong', attempts:n, lastAt:ts}
}
let store = loadStore();
function saveStore(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){}
}

function masteryOf(id){
  const r = store.results[id];
  if(!r) return 'unseen';
  return r.status === 'correct' ? 'correct' : 'wrong';
}

/* =========================================================
   SETUP STATE
   ========================================================= */
let selectedCats = new Set(CATEGORIES);
let selectedMastery = new Set(['unseen','wrong','correct']);
let selectedMode = 'practice';
let selectedCount = 'all';

/* =========================================================
   ELEMENT REFS
   ========================================================= */
const setupWrap = document.getElementById('setupWrap');
const imgcaseWrap = document.getElementById('imgcaseWrap');
const progressWrap = document.getElementById('progressWrap');
const quizWrap = document.getElementById('quizWrap');
const resultWrap = document.getElementById('resultWrap');
const tabs = document.querySelectorAll('.tab');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

/* =========================================================
   TABS
   ========================================================= */
tabs.forEach(t => t.addEventListener('click', () => {
  const which = t.dataset.tab;
  tabs.forEach(x => x.classList.toggle('active', x === t));
  setupWrap.classList.add('hidden');
  imgcaseWrap.classList.add('hidden');
  progressWrap.classList.add('hidden');
  quizWrap.classList.remove('active');
  resultWrap.classList.remove('active');

  if(which === 'quiz'){ setupWrap.classList.remove('hidden'); }
  if(which === 'imgcase'){ imgcaseWrap.classList.remove('hidden'); }
  if(which === 'progress'){ progressWrap.classList.remove('hidden'); renderProgress(); }
}));

/* =========================================================
   BUILD CATEGORY LIST
   ========================================================= */
const catList = document.getElementById('catList');
function catCount(cat){ return QUESTIONS.filter(q => q.cat === cat).length; }

CATEGORIES.forEach(cat => {
  const el = document.createElement('div');
  el.className = 'cat-item checked';
  el.dataset.cat = cat;
  el.innerHTML = `
    <div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="cat-name">${cat}</div>
    <div class="cat-count mono">${catCount(cat)}問</div>
  `;
  el.addEventListener('click', () => {
    if(selectedCats.has(cat)){ selectedCats.delete(cat); }
    else{ selectedCats.add(cat); }
    el.classList.toggle('checked');
    updateTotalLine();
  });
  catList.appendChild(el);
});

document.getElementById('selectAllBtn').addEventListener('click', () => {
  const allSelected = selectedCats.size === CATEGORIES.length;
  if(allSelected){ selectedCats = new Set(); }
  else{ selectedCats = new Set(CATEGORIES); }
  document.querySelectorAll('.cat-item').forEach(el => el.classList.toggle('checked', selectedCats.has(el.dataset.cat)));
  document.getElementById('selectAllBtn').textContent = allSelected ? 'すべて選択' : 'すべて解除';
  updateTotalLine();
});

/* =========================================================
   MASTERY CHIPS
   ========================================================= */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const k = chip.dataset.k;
    if(selectedMastery.has(k)){
      if(selectedMastery.size === 1){ showToast('少なくとも1つは選択してください'); return; }
      selectedMastery.delete(k);
    } else { selectedMastery.add(k); }
    chip.classList.toggle('on');
    updateTotalLine();
  });
});

/* =========================================================
   MODE CARDS
   ========================================================= */
document.getElementById('modePractice').addEventListener('click', () => {
  selectedMode = 'practice';
  document.getElementById('modePractice').classList.add('selected');
  document.getElementById('modeExam').classList.remove('selected');
});
document.getElementById('modeExam').addEventListener('click', () => {
  selectedMode = 'exam';
  document.getElementById('modeExam').classList.add('selected');
  document.getElementById('modePractice').classList.remove('selected');
});

/* =========================================================
   COUNT SELECTOR
   ========================================================= */
document.querySelectorAll('.count-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.count-opt').forEach(o => o.classList.remove('on'));
    opt.classList.add('on');
    selectedCount = opt.dataset.n;
    updateTotalLine();
  });
});

/* =========================================================
   TOTAL LINE / FILTERED POOL
   ========================================================= */
function filteredPool(){
  return QUESTIONS.filter(q => selectedCats.has(q.cat) && selectedMastery.has(masteryOf(q.id)));
}
function updateTotalLine(){
  const pool = filteredPool();
  const n = pool.length;
  const useN = selectedCount === 'all' ? n : Math.min(n, parseInt(selectedCount, 10));
  document.getElementById('totalLine').innerHTML = `<b>${n}問</b>が選択中の分野・条件に該当（うち <b>${useN}問</b> を出題します）`;
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('startHint');
  if(n === 0){
    startBtn.disabled = true;
    hint.textContent = '条件に一致する問題がありません。分野または習熟度の選択を見直してください。';
  } else {
    startBtn.disabled = false;
    hint.textContent = selectedMode === 'practice' ? '1問ずつ答え合わせをしながら進みます' : 'すべて解答後にまとめて採点します';
  }
}
updateTotalLine();

/* =========================================================
   QUIZ ENGINE
   ========================================================= */
let session = null; // {mode, order:[questions], idx, answers:{}, currentSel:Set, locked:bool}

document.getElementById('startBtn').addEventListener('click', () => {
  let pool = filteredPool();
  shuffle(pool);
  const n = selectedCount === 'all' ? pool.length : Math.min(pool.length, parseInt(selectedCount,10));
  pool = pool.slice(0, n);
  session = { mode: selectedMode, order: pool, idx: 0, answers: {}, currentSel: new Set(), locked: false };
  goToQuiz();
  renderQuestion();
});

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function goToQuiz(){
  tabs.forEach(x => x.classList.remove('active'));
  setupWrap.classList.add('hidden');
  imgcaseWrap.classList.add('hidden');
  progressWrap.classList.add('hidden');
  resultWrap.classList.remove('active');
  quizWrap.classList.add('active');
}

document.getElementById('quizCloseBtn').addEventListener('click', () => {
  if(session && Object.keys(session.answers).length > 0 && !confirm('演習を中断して条件設定に戻りますか？')) return;
  backToSetup();
});

function backToSetup(){
  quizWrap.classList.remove('active');
  resultWrap.classList.remove('active');
  setupWrap.classList.remove('hidden');
  tabs.forEach(x => x.classList.toggle('active', x.dataset.tab === 'quiz'));
  updateTotalLine();
}

const choiceList = document.getElementById('choiceList');
const answerBtn = document.getElementById('answerBtn');
const expBox = document.getElementById('expBox');

function currentQuestion(){ return session.order[session.idx]; }

function renderQuestion(){
  const q = currentQuestion();
  session.currentSel = new Set();
  session.locked = false;
  expBox.innerHTML = '';

  document.getElementById('quizProgressTxt').textContent = `${session.idx+1} / ${session.order.length}`;
  document.getElementById('quizBarFill').style.width = ((session.idx) / session.order.length * 100) + '%';
  document.getElementById('qCatTag').textContent = q.cat;

  const isMulti = q.ans.length > 1;
  const multiTag = document.getElementById('qMultiTag');
  if(isMulti){ multiTag.style.display = 'inline-flex'; multiTag.textContent = `${q.ans.length}つ選べ`; }
  else{ multiTag.style.display = 'none'; }

  document.getElementById('qText').textContent = q.q;

  choiceList.innerHTML = '';
  q.choices.forEach(ch => {
    const el = document.createElement('div');
    el.className = 'choice' + (isMulti ? ' multi' : '');
    el.dataset.k = ch.k;
    el.innerHTML = `<div class="choice-mark">${ch.k.toUpperCase()}</div><div class="choice-text">${ch.t}</div>`;
    el.addEventListener('click', () => onChoiceClick(el, ch.k, isMulti));
    choiceList.appendChild(el);
  });

  answerBtn.disabled = true;
  answerBtn.textContent = '回答する';
  answerBtn.onclick = onAnswerClick;
}

function onChoiceClick(el, k, isMulti){
  if(session.locked) return;
  if(isMulti){
    if(session.currentSel.has(k)){ session.currentSel.delete(k); el.classList.remove('selected'); }
    else{ session.currentSel.add(k); el.classList.add('selected'); }
  } else {
    session.currentSel = new Set([k]);
    document.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  }
  answerBtn.disabled = session.currentSel.size === 0;
}

function setsEqual(a, b){
  if(a.size !== b.size) return false;
  for(const x of a) if(!b.has(x)) return false;
  return true;
}

function onAnswerClick(){
  const q = currentQuestion();
  if(session.mode === 'practice' && !session.locked){
    lockAndGrade(q);
    return;
  }
  // exam mode or already locked -> advance
  advance();
}

function lockAndGrade(q){
  session.locked = true;
  const correctSet = new Set(q.ans);
  const isCorrect = setsEqual(session.currentSel, correctSet);
  session.answers[q.id] = { sel: [...session.currentSel], correct: isCorrect };
  recordResult(q.id, isCorrect);

  document.querySelectorAll('.choice').forEach(el => {
    const k = el.dataset.k;
    el.classList.add('locked');
    if(correctSet.has(k)) el.classList.add('correct');
    else if(session.currentSel.has(k)) el.classList.add('incorrect');
  });

  expBox.innerHTML = `
    <div class="exp-box ${isCorrect ? 'ok' : 'ng'}">
      <div class="exp-head">${isCorrect ? '○ 正解です' : '× 不正解'}　正解: ${q.ans.map(a=>a.toUpperCase()).join(', ')}</div>
      <div>${q.exp || '解説はありません。'}</div>
    </div>`;

  answerBtn.textContent = (session.idx === session.order.length - 1) ? '結果を見る' : '次の問題へ';
  answerBtn.disabled = false;
}

function recordResult(id, isCorrect){
  const prev = store.results[id] || { attempts: 0 };
  store.results[id] = {
    status: isCorrect ? 'correct' : 'wrong',
    attempts: (prev.attempts || 0) + 1,
    lastAt: Date.now()
  };
  saveStore();
}

function advance(){
  const q = currentQuestion();
  if(session.mode === 'exam'){
    // grade silently now if not yet answered this question
    if(!session.answers[q.id]){
      const correctSet = new Set(q.ans);
      const isCorrect = setsEqual(session.currentSel, correctSet);
      session.answers[q.id] = { sel: [...session.currentSel], correct: isCorrect };
      recordResult(q.id, isCorrect);
    }
  }
  if(session.idx < session.order.length - 1){
    session.idx++;
    renderQuestion();
  } else {
    document.getElementById('quizBarFill').style.width = '100%';
    showResult();
  }
}

/* =========================================================
   RESULT
   ========================================================= */
function showResult(){
  quizWrap.classList.remove('active');
  resultWrap.classList.add('active');

  const total = session.order.length;
  const correctCount = Object.values(session.answers).filter(a => a.correct).length;
  const pct = total ? Math.round(correctCount / total * 100) : 0;

  document.getElementById('resultPct').textContent = pct + '%';
  document.getElementById('resultFrac').textContent = `${correctCount}/${total}`;
  const circumference = 364;
  document.getElementById('resultRingFg').setAttribute('stroke-dashoffset', circumference - (circumference * pct/100));

  let title = 'お疲れさまでした';
  if(pct >= 90) title = '素晴らしい仕上がりです';
  else if(pct >= 70) title = 'あと一息です';
  else title = '要復習の分野を確認しましょう';
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = `${session.mode === 'practice' ? '演習モード' : '模擬試験モード'}・全${total}問中${correctCount}問正解`;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  session.order.forEach(q => {
    const a = session.answers[q.id];
    if(!a) return;
    const div = document.createElement('div');
    div.className = 'review-item ' + (a.correct ? 'right' : 'wrong');
    const selTxt = a.sel.map(k => k.toUpperCase()).join(', ') || '（未回答）';
    const ansTxt = q.ans.map(k => k.toUpperCase()).join(', ');
    div.innerHTML = `
      <div class="review-top">
        <span class="review-tag">${a.correct ? '正解' : '不正解'}</span>
        <span class="review-tag" style="background:var(--pink-100); color:var(--pink-700);">${q.cat}</span>
      </div>
      <div class="review-q">${q.q}</div>
      <div class="review-detail"><span class="lbl">あなたの解答:</span> ${selTxt}　<span class="lbl">正解:</span> ${ansTxt}</div>
      <div class="review-detail" style="margin-top:4px;">${q.exp || ''}</div>
    `;
    reviewList.appendChild(div);
  });
}

document.getElementById('resultBackBtn').addEventListener('click', backToSetup);

/* =========================================================
   PROGRESS TAB
   ========================================================= */
function renderProgress(){
  const answeredIds = Object.keys(store.results);
  const answered = answeredIds.length;
  const correct = answeredIds.filter(id => store.results[id].status === 'correct').length;

  document.getElementById('statAnswered').textContent = `${answered}/${QUESTIONS.length}`;
  document.getElementById('statAccuracy').textContent = answered ? Math.round(correct/answered*100) + '%' : '–';

  const list = document.getElementById('catProgList');
  list.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const qs = QUESTIONS.filter(q => q.cat === cat);
    const total = qs.length;
    const c = qs.filter(q => masteryOf(q.id) === 'correct').length;
    const w = qs.filter(q => masteryOf(q.id) === 'wrong').length;
    const row = document.createElement('div');
    row.className = 'cat-prog-row';
    row.innerHTML = `
      <div class="cat-prog-top"><span class="name">${cat}</span><span class="frac">${c+w}/${total}</span></div>
      <div class="bar-track">
        <div class="bar-fill-correct" style="width:${total? c/total*100:0}%"></div>
        <div class="bar-fill-wrong" style="width:${total? w/total*100:0}%"></div>
      </div>
    `;
    list.appendChild(row);
  });
}

document.getElementById('resetProgressBtn').addEventListener('click', () => {
  if(!confirm('すべての学習履歴をリセットします。よろしいですか？')) return;
  store = { results: {} };
  saveStore();
  renderProgress();
  updateTotalLine();
  showToast('学習履歴をリセットしました');
});

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('tabQuizCount').textContent = `全${QUESTIONS.length}問`;
</script>
