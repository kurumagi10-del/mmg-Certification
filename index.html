<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --surface-2:#F5F7F9;
    --ink:#1A2332;
    --ink-soft:#5A6474;
    --line:#DDE2E8;
    --primary:#2F5D73;
    --primary-dark:#204252;
    --primary-tint:#E4EDF0;
    --amber:#B8763A;
    --amber-tint:#F6EBDD;
    --good:#3F7A5C;
    --good-tint:#E5F0EA;
    --bad:#B14444;
    --bad-tint:#F7E7E7;
    --radius:14px;
    --shadow: 0 1px 2px rgba(26,35,50,0.04), 0 8px 24px -12px rgba(26,35,50,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  h1,h2,h3,.display{font-family:'Zen Kaku Gothic New', sans-serif;}

  /* ---- shell / filmstrip motif ---- */
  .app{max-width:760px;margin:0 auto;padding:0 18px 64px;}
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(238,241,244,0));
    padding:22px 0 10px;
  }
  .filmstrip{
    display:flex; gap:5px; padding:0 2px 10px;
  }
  .filmstrip i{
    width:6px; height:6px; border-radius:1px; background:var(--line);
  }
  .filmstrip i.done{background:var(--primary);}
  .filmstrip i.now{background:var(--amber);}

  .brand{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .brand h1{font-size:19px; font-weight:900; margin:0; letter-spacing:.01em; color:var(--primary-dark);}
  .brand .sub{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; letter-spacing:.03em;}

  .tabs{display:flex; gap:8px; margin:16px 0 4px;}
  .tab{
    flex:1; text-align:center; padding:11px 8px; border-radius:10px;
    background:var(--surface); border:1px solid var(--line);
    font-weight:700; font-size:13.5px; color:var(--ink-soft); cursor:pointer;
    transition:.15s;
  }
  .tab.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .tab .count{display:block; font-size:10.5px; font-weight:500; margin-top:2px; opacity:.75;}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px; margin-top:14px; border:1px solid rgba(26,35,50,0.03);
  }

  /* ---- setup screen ---- */
  .mode-choice{display:flex; gap:10px; margin-bottom:18px;}
  .mode-card{
    flex:1; border:1.5px solid var(--line); border-radius:12px; padding:14px 12px;
    cursor:pointer; transition:.15s; background:var(--surface-2);
  }
  .mode-card.selected{border-color:var(--primary); background:var(--primary-tint);}
  .mode-card .m-title{font-weight:700; font-size:14.5px; margin-bottom:3px;}
  .mode-card .m-desc{font-size:11.5px; color:var(--ink-soft); line-height:1.5;}

  .section-label{
    font-size:11.5px; font-weight:700; color:var(--primary-dark); letter-spacing:.05em;
    text-transform:uppercase; margin:20px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::after{content:""; flex:1; height:1px; background:var(--line);}

  .cat-group{margin-bottom:6px;}
  .cat-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:10px; cursor:pointer; border:1px solid var(--line);
    background:var(--surface-2); margin-bottom:6px; transition:.12s;
  }
  .cat-row:hover{border-color:var(--primary);}
  .cat-row.checked{background:var(--primary-tint); border-color:var(--primary);}
  .cat-row .cname{font-size:13.5px; font-weight:600;}
  .cat-row .cn{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .checkbox{
    width:18px; height:18px; border-radius:5px; border:1.5px solid #B7C0CA; flex:none;
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .cat-row.checked .checkbox{background:var(--primary); border-color:var(--primary);}
  .checkbox svg{display:none; width:11px; height:11px;}
  .cat-row.checked .checkbox svg{display:block;}

  .count-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .count-chip{
    padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface-2);
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .count-chip.selected{background:var(--primary); border-color:var(--primary); color:#fff;}
  .count-chip[data-level="new"].selected{background:var(--ink-soft); border-color:var(--ink-soft);}
  .count-chip[data-level="weak"].selected{background:var(--bad); border-color:var(--bad);}
  .count-chip[data-level="learning"].selected{background:var(--amber); border-color:var(--amber);}
  .count-chip[data-level="mastered"].selected{background:var(--good); border-color:var(--good);}

  .order-row{display:flex; gap:8px; margin-top:8px;}
  .order-row .count-chip{flex:1; text-align:center;}

  .btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    border:none; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
    transition:.15s;
  }
  .btn-primary{background:var(--primary); color:#fff; margin-top:22px;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:#B7C0CA; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  .btn-small{padding:9px 14px; font-size:12.5px; width:auto; display:inline-block;}

  .hint{font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.6;}

  /* ---- quiz screen ---- */
  .quiz-top{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .quiz-progress{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
  .quiz-progress b{color:var(--ink);}
  .tag-row{display:flex; gap:6px; margin:14px 0 12px; flex-wrap:wrap;}
  .tag{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--amber-tint); color:var(--amber); font-family:'JetBrains Mono',monospace;
  }
  .tag.sub{background:var(--surface-2); color:var(--ink-soft);}
  .q-id{font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; letter-spacing:.03em;}

  .q-text{font-size:16.5px; font-weight:600; line-height:1.7; margin:6px 0 18px;}
  .multi-note{font-size:12px; color:var(--amber); font-weight:700; margin:-10px 0 14px;}

  .q-image-wrap{margin:-4px 0 18px; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#101B22;}
  .q-image-wrap img{display:block; width:100%; height:auto; max-height:380px; object-fit:contain; background:#101B22;}
  .q-image-error{display:none; padding:16px; font-size:12px; color:var(--bad); text-align:center; background:var(--bad-tint);}

  .choice{
    display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border-radius:11px;
    border:1.5px solid var(--line); margin-bottom:9px; cursor:pointer; transition:.12s;
    background:var(--surface);
  }
  .choice:hover{border-color:var(--primary);}
  .choice.selected{border-color:var(--primary); background:var(--primary-tint);}
  .choice .mark{
    width:22px; height:22px; border-radius:7px; border:1.5px solid #B7C0CA; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;
    color:var(--ink-soft); background:#fff; font-family:'JetBrains Mono',monospace;
  }
  .choice.selected .mark{background:var(--primary); border-color:var(--primary); color:#fff;}
  .choice .ctext{font-size:14.5px; line-height:1.6; padding-top:1px;}

  .choice.correct{border-color:var(--good); background:var(--good-tint);}
  .choice.correct .mark{background:var(--good); border-color:var(--good); color:#fff;}
  .choice.wrong{border-color:var(--bad); background:var(--bad-tint);}
  .choice.wrong .mark{background:var(--bad); border-color:var(--bad); color:#fff;}

  .feedback{
    margin-top:16px; padding:16px; border-radius:12px; animation:fade .25s ease;
  }
  .feedback.ok{background:var(--good-tint); border:1px solid #BFDCCC;}
  .feedback.ng{background:var(--bad-tint); border:1px solid #E9C4C4;}
  .feedback .fb-title{font-weight:800; font-size:14px; margin-bottom:6px;}
  .feedback.ok .fb-title{color:var(--good);}
  .feedback.ng .fb-title{color:var(--bad);}
  .feedback .fb-body{font-size:13.5px; line-height:1.7; color:var(--ink);}
  .feedback .fb-ref{font-size:11.5px; color:var(--ink-soft); margin-top:8px; font-family:'JetBrains Mono',monospace;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .quiz-actions{display:flex; gap:10px; margin-top:20px;}
  .quiz-actions .btn{margin-top:0;}

  /* ---- results ---- */
  .score-hero{text-align:center; padding:26px 10px 8px;}
  .score-hero .big{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:52px; color:var(--primary-dark); line-height:1;}
  .score-hero .big span{font-size:22px; color:var(--ink-soft); font-weight:700;}
  .score-hero .label{font-size:12.5px; color:var(--ink-soft); margin-top:6px; font-weight:600;}

  .breakdown-row{
    display:flex; align-items:center; justify-content:space-between; padding:11px 4px;
    border-bottom:1px solid var(--line); font-size:13px;
  }
  .breakdown-row:last-child{border-bottom:none;}
  .bar-wrap{flex:1; margin:0 12px; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--primary); border-radius:99px;}
  .breakdown-row .bnum{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); flex:none;}

  .review-item{border:1px solid var(--line); border-radius:11px; padding:14px; margin-top:10px;}
  .review-item .rq{font-size:13.5px; font-weight:600; margin-bottom:8px; line-height:1.6;}
  .review-item .ranswer{font-size:12.5px; line-height:1.7;}
  .review-item .ranswer .bad-a{color:var(--bad); font-weight:700;}
  .review-item .ranswer .good-a{color:var(--good); font-weight:700;}
  .review-item .rexp{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.7;}

  .empty-tab{padding:40px 20px; text-align:center; color:var(--ink-soft);}
  .empty-tab .big-icon{font-size:34px; margin-bottom:10px;}
  .empty-tab h3{margin:0 0 8px; color:var(--ink); font-size:16px;}
  .empty-tab p{font-size:13px; line-height:1.7; margin:0;}

  /* ---- progress dashboard ---- */
  .stat-hero{display:flex; gap:10px; margin-top:14px;}
  .stat-box{flex:1; background:var(--surface-2); border-radius:12px; padding:16px 8px; text-align:center; border:1px solid var(--line);}
  .stat-box .snum{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:24px; color:var(--primary-dark);}
  .stat-box .slabel{font-size:10.5px; color:var(--ink-soft); margin-top:4px; font-weight:600;}

  .mastery-pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px;}
  .mastery-pill.new{background:#E9ECEF; color:var(--ink-soft);}
  .mastery-pill.weak{background:var(--bad-tint); color:var(--bad);}
  .mastery-pill.learning{background:var(--amber-tint); color:var(--amber);}
  .mastery-pill.mastered{background:var(--good-tint); color:var(--good);}

  .cat-block{margin-top:14px;}
  .cat-block-title{display:flex; align-items:center; justify-content:space-between; font-size:14.5px; font-weight:800; color:var(--primary-dark); margin-bottom:8px;}
  .subcat-row{padding:9px 0; border-bottom:1px solid var(--line);}
  .subcat-row:last-child{border-bottom:none;}
  .subcat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:8px;}
  .subcat-name{font-size:12.5px; font-weight:600;}
  .subcat-meta{font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; flex:none;}

  /* ---- image case viewer ---- */
  .case-list-item{
    display:flex; align-items:center; gap:14px; padding:14px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--surface-2); cursor:pointer; margin-bottom:10px; transition:.12s;
  }
  .case-list-item:hover{border-color:var(--primary);}
  .case-thumb{width:56px; height:56px; border-radius:9px; overflow:hidden; flex:none; background:#101B22;}
  .case-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .case-list-item .ctitle{font-weight:700; font-size:14px;}
  .case-list-item .csub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .case-list-item .cstatus{margin-left:auto; font-size:10.5px; font-family:'JetBrains Mono',monospace; color:var(--ink-soft); flex:none;}
  .case-list-item .cstatus.done{color:var(--good); font-weight:700;}

  .case-nav{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .case-nav-btn{
    font-size:12.5px; font-weight:700; color:var(--primary); cursor:pointer; padding:6px 10px;
    border-radius:8px; background:var(--primary-tint);
  }
  .case-gallery{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .case-gallery figure{margin:0; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#101B22;}
  .case-gallery img{width:100%; display:block;}
  .case-gallery figcaption{
    text-align:center; font-size:11.5px; color:#EAF1F3; background:#101B22; padding:7px; font-weight:600;
  }

  .reveal-panel{margin-top:18px; padding-top:4px;}
  .answer-box{
    display:flex; flex-direction:column; gap:6px; padding:16px; border-radius:12px;
    background:var(--primary-tint); border:1px solid #C9DBE1; margin-bottom:14px;
  }
  .answer-box .a-finding{font-size:13px; color:var(--primary-dark); font-weight:600;}
  .answer-box .a-arrow{font-size:11px; color:var(--ink-soft); text-align:center;}
  .answer-box .a-cat{font-size:13px; font-weight:700; color:var(--amber); text-align:center;}
  .answer-box .a-diagnosis{font-size:19px; font-weight:900; color:var(--primary-dark); text-align:center; font-family:'Zen Kaku Gothic New',sans-serif;}
  .case-schema{margin:0 0 14px; text-align:center;}
  .case-schema:empty{display:none; margin:0;}
  .case-schema img{max-width:220px; width:70%; border-radius:10px; border:1px solid var(--line);}
  .case-explanation{font-size:13px; line-height:1.8; white-space:pre-wrap; color:var(--ink);}
  .case-reference{font-size:11.5px; color:var(--ink-soft); margin-top:10px; font-family:'JetBrains Mono',monospace;}

  .cat-choice-row{display:flex; gap:9px; margin-top:16px;}
  .cat-choice{
    flex:1; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:19px; color:var(--ink-soft);
    cursor:pointer; transition:.12s;
  }
  .cat-choice:hover{border-color:var(--primary);}
  .cat-choice.selected{border-color:var(--primary); background:var(--primary-tint); color:var(--primary-dark);}
  .cat-choice.correct{border-color:var(--good); background:var(--good-tint); color:var(--good);}
  .cat-choice.wrong{border-color:var(--bad); background:var(--bad-tint); color:var(--bad);}
  .cat-choice-label{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:8px;}
  .case-result-note{
    text-align:center; font-weight:800; font-size:13.5px; margin-top:12px; padding:10px; border-radius:10px;
  }
  .case-result-note.ok{background:var(--good-tint); color:var(--good);}
  .case-result-note.ng{background:var(--bad-tint); color:var(--bad);}

  ::selection{background:var(--primary); color:#fff;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="filmstrip" id="filmstrip"></div>
    <div class="brand">
      <h1>マンモグラフィ認定試験対策</h1>
      <div class="sub mono" id="brandSub">STUDY DECK</div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="mc" id="tabMc">5択問題<span class="count" id="tabMcCount"></span></div>
      <div class="tab" data-tab="case" id="tabCase">画像症例<span class="count" id="tabCaseCount"></span></div>
      <div class="tab" data-tab="progress" id="tabProgress">進捗</div>
    </div>
  </div>

  <!-- ===== 5択問題タブ ===== -->
  <div class="panel active" id="panelMc">

    <div id="mcSetup">
      <div class="card">
        <div class="section-label">モード</div>
        <div class="mode-choice">
          <div class="mode-card selected" data-mode="drill" id="modeDrill">
            <div class="m-title">演習モード</div>
            <div class="m-desc">1問ずつ回答→即座に正誤と解説を確認</div>
          </div>
          <div class="mode-card" data-mode="exam" id="modeExam">
            <div class="m-title">模擬試験モード</div>
            <div class="m-desc">最後まで解いてから採点・解説をまとめて確認</div>
          </div>
        </div>

        <div class="section-label">出題分野</div>
        <div id="catList"></div>
        <div class="hint" id="selCount">0問が選択中の分野に該当</div>

        <div class="section-label">習熟度で絞る</div>
        <div class="count-row" id="levelRow"></div>
        <div class="hint">苦手・学習中だけに絞って重点的に演習できます。すべて選択中の場合は全問が対象です。</div>

        <div class="section-label">出題数</div>
        <div class="count-row" id="countRow"></div>

        <div class="section-label">出題順</div>
        <div class="order-row">
          <div class="count-chip selected" data-order="random">ランダム</div>
          <div class="count-chip" data-order="id">ID順</div>
        </div>

        <button class="btn btn-primary" id="startBtn">この条件で開始する</button>
      </div>
    </div>

    <div id="mcQuiz" style="display:none;"></div>
    <div id="mcResult" style="display:none;"></div>
  </div>

  <!-- ===== 画像症例タブ ===== -->
  <div class="panel" id="panelCase">
    <div id="caseListView"></div>
    <div id="caseDetailView" style="display:none;"></div>
  </div>

  <!-- ===== 進捗タブ ===== -->
  <div class="panel" id="panelProgress">
    <div id="progressContent"></div>
  </div>
</div>

<script>
const QUESTIONS = [{"id": "P1-1", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "悪性石灰化には分泌型と壊死型がある。", "b": "浸潤癌は浸潤性乳管癌と特殊型に分類される。", "c": "浸潤性乳管癌は病理総論的には腺癌に属する。", "d": "小葉は大部分の乳腺疾患が発生する場所である。", "e": "乳管癌と小葉癌を区別するのは発生部位である。"}, "correct": ["e"], "explanation": "乳管癌と小葉癌を区別するのは発生部位ではなく増殖パターンである。", "image_url": "", "reference": "病理I", "tags": ["乳管癌", "小葉癌", "増殖パターン"]}, {"id": "P1-2", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "非浸潤性乳管癌が転移することはほとんどない。", "b": "微小石灰化が腺葉に一致した分布を示すと浸潤癌を疑う。", "c": "非浸潤癌とは基底膜を超える浸潤がみられないものをいう。", "d": "分泌癌は若年性癌とも呼ばれているが、組織形態の名称である。", "e": "嚢胞による石灰化は両側乳房にびまん性にみられることが多い。"}, "correct": ["b"], "explanation": "マンモグラフィ上、微小石灰化が腺葉に一致した分布を示す場合は非浸潤癌を疑う。", "image_url": "", "reference": "病理I", "tags": ["微小石灰化", "非浸潤癌", "分泌癌", "嚢胞"]}, {"id": "P1-3", "category": "乳腺の基礎知識", "subcategory": "良性病変", "question": "乳腺症を構成する部分像でないのはどれか。", "choices": {"a": "嚢胞", "b": "線維腫症", "c": "硬化性腺症", "d": "小葉増生症", "e": "アポクリン化生"}, "correct": ["b"], "explanation": "線維腫症は非上皮性腫瘍であり、乳腺症を構成する部分像ではない。乳腺症を構成するのは線維腺腫症などである。", "image_url": "", "reference": "病理I", "tags": ["乳腺症", "線維腫症", "アポクリン化生"]}, {"id": "P1-4", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "髄様癌はリンパ節転移が多い。", "b": "非浸潤癌と乳管内癌は同義語である。", "c": "乳管拡張症は一般に乳腺炎と呼ばれる。", "d": "過誤腫の代表的なものは脂肪腫である。", "e": "炎症性偽腫瘍で最も多いのは外傷性脂肪壊死である。"}, "correct": ["a", "d"], "explanation": "髄様癌はリンパ節転移が少ない傾向にある。また、過誤腫の代表例は脂肪腫ではなく腺脂肪腫である。", "image_url": "", "reference": "病理I", "tags": ["髄様癌", "過誤腫", "乳管拡張症", "脂肪壊死"]}, {"id": "P1-5", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "嚢胞は常に丸い輪郭を示す。", "b": "葉状腫瘍は悪性腫瘍ではない。", "c": "乳管腺腫は上皮性腫瘍である。", "d": "浸潤性小葉癌は欧米型の癌である。", "e": "線維腺腫は若年者より高齢者に多く発症する。"}, "correct": ["b", "e"], "explanation": "葉状腫瘍は良性・境界病変・悪性に分類される。線維腺腫は高齢者よりも若年者（20〜30代）に多く発症する。", "image_url": "", "reference": "病理I", "tags": ["葉状腫瘍", "線維腺腫", "嚢胞", "浸潤性小葉癌"]}, {"id": "P1-6", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "乳腺症には炎症性病変は含まれない。", "b": "非浸潤性乳癌の大部分はTDLUに発生する。", "c": "間質肉腫は血管肉腫を除く軟部肉腫である。", "d": "乳管内乳頭腫症は乳腺症の構成成分の一つである。", "e": "巨大線維腺腫は若年性線維腺腫とも呼ばれている。"}, "correct": ["d"], "explanation": "乳腺症の構成成分は「乳管乳頭腫症」であり、多発性腫瘍である「乳管内乳頭腫症」とは病理学的に異なる。", "image_url": "", "reference": "病理I", "tags": ["乳腺症", "TDLU", "乳管乳頭腫症", "間質肉腫"]}, {"id": "P1-7", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "粘液癌は高齢者に多く予後が良い。", "b": "乳癌には骨や軟骨形成を伴わない。", "c": "乳頭腫は乳癌発生の危険因子である。", "d": "過誤腫は境界明瞭な良性病変である。", "e": "浸潤性小葉癌は境界不明瞭な腫瘤である。"}, "correct": ["b"], "explanation": "乳癌は極めて稀に骨や軟骨形成を伴うことがあり、取扱い規約でも浸潤癌の特殊型（化生癌等）に分類される。", "image_url": "", "reference": "病理I", "tags": ["粘液癌", "化生癌", "乳頭腫", "過誤腫"]}, {"id": "P1-8", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "70歳の嚢胞内腫瘍は癌を第一に考える。", "b": "乳輪下膿瘍は瘻孔を併発することがある。", "c": "浸潤性小葉癌はskip lesionを形成しない。", "d": "硬性型は浸潤傾向が強いが、予後は比較的良い。", "e": "乳腺症は閉経期に向かって減少し、閉経後は増加する。"}, "correct": ["a", "b"], "explanation": "高年齢での嚢胞内腫瘍は癌を第一に疑う。また、乳輪下膿瘍は難治性で皮膚に通じる瘻孔を形成することがある。", "image_url": "", "reference": "病理I", "tags": ["嚢胞内腫瘍", "乳輪下膿瘍", "浸潤性小葉癌", "硬性型"]}, {"id": "P1-9", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "非浸潤癌はステージⅠ期である。", "b": "炎症性乳癌は乳癌の中でも最も予後が悪い。", "c": "非浸潤性小葉癌は偶然発見されることが多い。", "d": "浸潤性乳管癌は乳癌全体の約80〜90％を占める。", "e": "乳腺症は女性乳房に起こる最も頻度が高い疾患である。"}, "correct": ["a"], "explanation": "非浸潤癌はステージ0期に分類される。", "image_url": "", "reference": "病理I", "tags": ["非浸潤癌", "ステージ", "炎症性乳癌", "浸潤性乳管癌"]}, {"id": "P1-10", "category": "乳腺の基礎知識", "subcategory": "画像所見", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "脂肪を含むリンパ節は異常である。", "b": "CC撮影でoil cystはtea cup signとなる。", "c": "腺管形成型は画像上、非浸潤癌と酷似している。", "d": "嚢胞内腫瘍はほとんどが境界不明瞭な腫瘤である。", "e": "ポップコーン状石灰化は退縮した線維腺腫にみられる。"}, "correct": ["c", "e"], "explanation": "腺管形成型は画像上非浸潤癌に似ることがあり、退縮した線維腺腫には特徴的なポップコーン状石灰化がみられる。", "image_url": "", "reference": "病理I", "tags": ["ポップコーン状石灰化", "線維腺腫", "腺管形成型", "オイルシスト"]}, {"id": "P1-11", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "線維腺腫の中にも癌は発生する。", "b": "乳管内乳頭癌は浸潤型の特殊型である。", "c": "髄様癌は低分化な浸潤性の特殊型である。", "d": "乳管内乳頭腫は年齢とともに悪性化しやすくなる。", "e": "乳管拡張症はtea cup signがみられることがある。"}, "correct": ["b"], "explanation": "乳管内乳頭癌は浸潤型ではなく非浸潤癌の特殊型（あるいは非浸潤性病変）に分類される。", "image_url": "", "reference": "病理I", "tags": ["乳管内乳頭癌", "非浸潤癌", "髄様癌", "乳管拡張症"]}, {"id": "P1-12", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "上皮内癌と非浸潤癌は同義語である。", "b": "DCISの悪性度が高いほど石灰化を伴いやすい。", "c": "分泌癌は若年者にみられ、成人には発生しない。", "d": "乳管拡張症で腫瘍形成性のものでいは黄色肉芽腫がある。", "e": "乳腺症の中で発生頻度が高いものはアポクリン化生である。"}, "correct": ["c"], "explanation": "分泌癌は若年者に多く見られるが、成人にも発生する。", "image_url": "", "reference": "病理I", "tags": ["分泌癌", "DCIS", "上皮内癌", "乳管拡張症"]}, {"id": "P1-13", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "乳頭部腺腫は男性にも生じる。", "b": "非浸潤癌は放置すると約30％は浸潤癌となる。", "c": "管状癌は境界明瞭な腫瘤で高分化な浸潤癌である。", "d": "脂肪壊死は石灰化を伴う嚢胞陰影を示すことがある。", "e": "過誤腫は境界明瞭で特有のマンモグラフィ像を示す。"}, "correct": ["c"], "explanation": "管状癌は高分化な浸潤癌であるが、境界は不明瞭（スピキュラを伴う）な腫瘤を形成する。", "image_url": "", "reference": "病理I", "tags": ["管状癌", "過誤腫", "乳頭部腺腫", "脂肪壊死"]}, {"id": "P1-14", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち誤っているのはどれか。", "choices": {"a": "男性乳癌は女子乳癌より予後不良である。", "b": "パジェット病は乳癌の表皮内進展である。", "c": "嚢胞と嚢胞内腫瘍の鑑別には超音波が良い。", "d": "浸潤性小葉癌はわが国では欧米に比べて少ない。", "e": "鋳型石灰化は中心が壊死してるから栄養血管が少ない。"}, "correct": ["a"], "explanation": "男性乳癌の予後は女性乳癌の予後とほとんど変わらないとされている。", "image_url": "", "reference": "病理I", "tags": ["男性乳癌", "パジェット病", "浸潤性小葉癌", "鋳型石灰化"]}, {"id": "P1-15", "category": "乳腺の基礎知識", "subcategory": "疾患全般", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "管状癌は大多数が1cm以下である。", "b": "腺管形成型は乳管内には進展しない。", "c": "葉状腫瘍と線維腺腫との鑑別は容易である。", "d": "DCISは乳管内に壊死が生じるため石灰化が起こる。", "e": "パジェット病は「 副腎皮質ホルモンは乳腺の発育に影響を与えている。", "b": "プロラクチンと成長ホルモンは乳腺の発育に影響を与えている。", "c": "腺房の発達はエストロゲンとプロゲステロンの両方の作用による。", "d": "乳児の吸乳刺激が母親の視床下部に作用してオキシトシンが分泌される。", "e": "エストロゲン、プロゲステロンのホルモンは乳癌発生を抑える因子である。"}, "correct": ["e"], "explanation": "エストロゲンやプロゲステロンなどの女性ホルモンは、乳癌の発生・増殖を促進する因子である。", "image_url": "", "reference": "解剖と生理", "tags": ["女性ホルモン", "エストロゲン", "プロゲステロン", "オキシトシン"]}, {"id": "AP-15", "category": "乳腺の基礎知識", "subcategory": "解剖生理", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "30歳以上で未婚では乳癌になるリスクが低くなる。", "b": "閉経年齢が55歳以上は乳癌になるリスクが高くなる。", "c": "母姉妹が乳癌であるなら乳癌になるリスクが高くなる。", "d": "エストロゲン受容体を持っている人は乳癌リスクが低い。", "e": "高蛋白、高脂肪による肥満は乳癌になるリスクが高くなる。"}, "correct": ["a", "d"], "explanation": "30歳以上未婚やエストロゲン受容体陽性の場合は乳癌のリスクが高くなる。", "image_url": "", "reference": "解剖と生理", "tags": ["乳癌リスク", "未婚", "閉経年齢", "エストロゲン受容体", "肥満"]}, {"id": "CL-01", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "授乳歴があれば乳癌の危険因子が増加する。", "b": "出産回数が少ないほど乳癌の罹患率は増加する。", "c": "エストロゲンは乳癌発生の最も強い影響を有している。", "d": "センチネルリンパ節は癌細胞が最初に到達するリンパ節のことである。", "e": "絶対に乳癌にならない方法はない。早期発見・早期治療が最善の対策である。"}, "correct": ["a"], "explanation": "授乳期間中は無月経となりエストロゲンなどの女性ホルモン濃度が低く保たれるため、長い目で見ると授乳歴は乳癌の危険因子を減少させます。", "image_url": "", "reference": "臨床", "tags": ["授乳歴", "危険因子", "センチネルリンパ節"]}, {"id": "CL-02", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "乳癌は化学療法がよく効く腫瘍である。", "b": "ホルモン補充療法により乳癌リスクは低下する。", "c": "乳房温存療法の適応は3cm以下であることが望ましい。", "d": "両側乳房の硬結、疼痛、乳頭分泌が乳腺症の典型的症状である。", "e": "病期分類Ⅰ期とはしこりが2㎝以下でリンパ節転移がないものをいう。"}, "correct": ["b"], "explanation": "ホルモン補充療法は女性ホルモン（エストロゲンやプロゲステロン）を補うため、乳癌の発症リスクを増加させます。", "image_url": "", "reference": "臨床", "tags": ["ホルモン補充療法", "乳房温存療法", "乳腺症"]}, {"id": "CL-03", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "ステージ0はT1N0M0である。", "b": "M1は遠隔リンパ節転移なしである。", "c": "乳癌はえくぼ症状を呈することが多い。", "d": "T3とは腫瘍径が5cmを超えるものをいう。", "e": "非触知乳癌でリンパ節転移のないものはほぼ100％治療できる。"}, "correct": ["a", "b"], "explanation": "ステージ0のTNM分類は「TisN0M0」であり、M1は「遠隔転移あり」を意味します。", "image_url": "", "reference": "臨床", "tags": ["TNM分類", "ステージ", "えくぼ症状"]}, {"id": "CL-04", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "TisにはDCISが含まれる。", "b": "T4には炎症性乳癌が含まれない。", "c": "N1は固定の腋窩リンパ節転移陽性である。", "d": "乳癌は代表的なホルモン依存性腫瘍である。", "e": "乳癌では腋窩リンパ節がセンチネルリンパ節となる。"}, "correct": ["b", "c"], "explanation": "T4には炎症性乳癌が含まれます。また、固定した腋窩リンパ節転移はN2に分類され、N1は可動性の腋窩リンパ節転移を指します。", "image_url": "", "reference": "臨床", "tags": ["TNM分類", "DCIS", "炎症性乳癌"]}, {"id": "CL-05", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "BRCA1、BRCA2は家族性乳癌の遺伝子である。", "b": "センチネルリンパ節はT1N0M0、T2N0M0に行う。", "c": "センチネルとは「見張り」、「歩哨」の意味である。", "d": "乳房温存療法の前に化学療法やホルモン療法を行う。", "e": "HER-2の発現亢進の有無は進行癌における抗癌剤判定基準となる。"}, "correct": ["b"], "explanation": "センチネルリンパ節生検の適応は、臨床的に腋窩リンパ節転移を認めない早期乳癌（TisN0M0やT1N0M0など）が対象となります。", "image_url": "", "reference": "臨床", "tags": ["BRCA1", "センチネルリンパ節生検", "HER2"]}, {"id": "CL-06", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "習慣的運動は乳癌リスクを減少させる。", "b": "センチネルリンパ節が見つからないことがある。", "c": "T3とは胸壁または皮膚浸潤を認めるものをいう。", "d": "乳房温存療法は原則として乳房照射が併用されている。", "e": "Tの大きさは視触診、画像診断を用いて総合的に判定する。"}, "correct": ["c"], "explanation": "胸壁または皮膚への直接浸潤を認めるものはT4に分類されます（T3は腫瘍径が5cmを超えるもの）。", "image_url": "", "reference": "臨床", "tags": ["習慣的運動", "TNM分類", "乳房温存療法"]}, {"id": "CL-07", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "胸壁には胸筋が含まれる。", "b": "乳癌の予後因子はTNMが重要である。", "c": "腫瘍径が大きくなれば陽性断端率は減少する。", "d": "Tisには腫瘤を認めないPaget病は含まれない。", "e": "T2とは腫瘍径が2㎝を超え、5㎝以下のものをいう。"}, "correct": ["b", "e"], "explanation": "乳癌の予後予測にはTNM分類による病期分類が最も重要です。また、T2は腫瘍径が2cmを超え5cm以下のものを指します。", "image_url": "", "reference": "臨床", "tags": ["予後因子", "TNM分類", "胸壁"]}, {"id": "CL-08", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "Tisには非浸潤性小葉癌は含まれない。", "b": "乳管内乳頭癌・DCISともにTis-0である。", "c": "リンパ節の転移が乳癌の悪性度を決めるわけではない。", "d": "乳癌の遺伝子異常としてHER-2の過剰発現が指摘されている。", "e": "センチネルリンパ節は色素法とアイソトープ法は併用してはいけない。"}, "correct": ["b", "d"], "explanation": "DCIS（非浸潤性乳管癌）はTisに分類されます。また、乳癌ではHER-2遺伝子の過剰発現・増幅が重要な遺伝子異常として知られています。", "image_url": "", "reference": "臨床", "tags": ["Tis", "DCIS", "HER2", "センチネルリンパ節"]}, {"id": "CL-09", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "化学療法は高齢者ほど効果がある。", "b": "家族性乳癌は全乳癌の5〜10％を占める。", "c": "閉経後肥満は乳癌による死亡危険因子である。", "d": "乳癌の悪性度は病変の大きさ、細胞型によって変わる。", "e": "腋窩リンパ節郭清の合併症として上肢のむくみ、運動障害などがある。"}, "correct": ["a"], "explanation": "化学療法は、ホルモン受容体や細胞増殖能の特性などから若年者ほど効果が高いとされています。", "image_url": "", "reference": "臨床", "tags": ["化学療法", "家族性乳癌", "リンパ節郭清"]}, {"id": "CL-10", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "TXとは評価不能のことである。", "b": "乳癌でも硬結のみの場合がある。", "c": "初潮年齢が11歳以下は乳癌の危険因子となる。", "d": "手術中の迅速病理結果と永久病理結果は同じである。", "e": "センチネルリンパ節陰性と診断されても腋窩リンパ節に転移することがある。"}, "correct": ["d"], "explanation": "手術中の迅速病理診断では一部の断面しか観察しないため、術後の永久病理診断（詳細な検体観察）と結果が異なる場合があります。", "image_url": "", "reference": "臨床", "tags": ["TX", "初潮年齢", "迅速病理診断"]}, {"id": "CL-11", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "dimpling signはえくぼ様にみえる場合に用いる。", "b": "乳癌の直径が5mmから10mmになるのに半年かかる。", "c": "血性分泌物の起因は非浸潤性乳管癌がほとんどである。", "d": "乳頭分泌が乳白色、緑色で多孔性の場合、悪性を考える。", "e": "予後を予測する上で組織学的リンパ節転移の個数を用いている。"}, "correct": ["c", "d"], "explanation": "血性分泌物の原因で最も多いのは良性の乳管内乳頭腫です。また、乳白色〜緑色で多孔性の分泌は乳腺症などの良性疾患を示唆します。", "image_url": "", "reference": "臨床", "tags": ["dimpling sign", "乳頭分泌", "乳管内乳頭腫"]}, {"id": "CL-12", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "Halsted法とは胸筋温存乳房切除術である。", "b": "Patey法は大胸筋のみを温存する。", "c": "病理組織の一片がDCISだった場合、リンパ節転移はしない。", "d": "腫瘍性乳頭分泌の特徴としては片側性で単孔性、漿液性である。", "e": "Auchincloss-Madden法は大小両胸筋を温存して乳房切除を行う。"}, "correct": ["a", "c"], "explanation": "Halsted法は大胸筋・小胸筋をともに切除する「定型（胸筋合併）乳房切除術」です。また、一部がDCISと判定されても他部分に浸潤癌が存在する可能性があり、リンパ節転移を完全に否定はできません。", "image_url": "", "reference": "臨床", "tags": ["Halsted法", "Patey法", "DCIS"]}, {"id": "CL-13", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "圧痛は乳癌で認められることがある。", "b": "視診で皮膚の陥凹のことをDellという。", "c": "乳房皮膚の発赤では炎症性疾患を第一に考える。", "d": "乳房浮腫は圧排性増殖を示す腫瘍の存在が示唆される。", "e": "乳頭部びらんをきたす疾患としては乳頭部腺腫が上げられる。"}, "correct": ["d"], "explanation": "圧排性増殖を示す腫瘍が存在する場合は皮膚の「膨隆」がみられます。浮腫は皮下リンパ管の閉塞や浸潤などによって発生します。", "image_url": "", "reference": "臨床", "tags": ["Dell", "乳房浮腫", "乳頭部腺腫"]}, {"id": "CL-14", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "乳房温存療法の非適応条件はどれか。", "choices": {"a": "乳房照射の既往", "b": "多発病巣のない乳癌", "c": "放射線療法が可能な乳癌", "d": "乳房温存療法を希望する場合", "e": "広範な乳管内進展を示す所見がない乳癌"}, "correct": ["a"], "explanation": "過去に同側胸部への放射線照射既往がある場合は、耐容線量や晩期障害の観点から乳房温存療法の非適応条件（絶対禁忌）となります。", "image_url": "", "reference": "臨床", "tags": ["乳房温存療法", "適応条件", "放射線照射"]}, {"id": "CL-15", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "腫瘤を触知する血性乳頭分泌症例が乳管造影の適応である。", "b": "ER、PgR、HER2が陰性の乳癌をトリプルネガティブ乳癌という。", "c": "乳腺CTは乳癌症例に対して術前の広がり診断を行うことが主たる目的である。", "d": "マンモグラフィで検出された触知不能な悪性疑う病変にはステレオガイド下生検を行う。", "e": "穿刺吸引細胞診とは超音波検査で腫瘤が見つかったときに良性か否かを診断するために行う検査である。"}, "correct": ["a"], "explanation": "乳管造影や乳管内視鏡の適応となるのは、「腫瘤を触知しない」血性・漿液性乳頭異常分泌症例です。", "image_url": "", "reference": "臨床", "tags": ["乳管造影", "トリプルネガティブ乳癌", "穿刺吸引細胞診"]}, {"id": "CL-16", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "えくぼ症状は外傷や手術後にもみられる。", "b": "皮膚の発赤を認める場合は悪性の可能性がある。", "c": "センチネルリンパ節転移があると定型乳房切除術を行う。", "d": "炎症や癌の浸潤が皮下やクーパー靭帯に及んだ場合、皮膚の陥凹がみられる。", "e": "センチネルリンパ節は色素法やアイソトープを併用すると同定の確率が高くなる。"}, "correct": ["c"], "explanation": "センチネルリンパ節転移が陽性の場合は、腋窩リンパ節郭清（または非定型乳房切除術など）が行われ、胸筋を切除する定型乳房切除術を行うわけではありません。", "image_url": "", "reference": "臨床", "tags": ["えくぼ症状", "センチネルリンパ節", "定型乳房切除術"]}, {"id": "CL-17", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "母姉妹が乳癌であるなら乳癌リスクになる。", "b": "予後を予測する上で組織学的リンパ節の転移の数は最も信頼できる。", "c": "病期の診断は適切な治療法を選択し、経過の見通しを予測する上で役立つ。", "d": "微小な石灰化が集族しているものは石灰化の形に関係なく穿刺吸引細胞診を行う。", "e": "病期とは病巣の大きさや体内での広がりから癌を分類し、進行の程度を示すものである。"}, "correct": ["d"], "explanation": "非触知の微小石灰化病変に対しては、細胞診ではなく組織が採取できるステレオガイド下マンモトーム生検（針生検）を行います。", "image_url": "", "reference": "臨床", "tags": ["予後因子", "微小石灰化", "マンモトーム生検"]}, {"id": "CL-18", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち正しいものはどれか。2つ選べ。", "choices": {"a": "血性分泌物の最も多いのは乳癌である。", "b": "乳頭分泌が乳白色、多孔、両側のときは、ほぼ良性である。", "c": "マンモトームとは組織採取を容易にするための吸引式針生検装置のことである。", "d": "胸筋合併乳房切除術には大胸筋間溝は開排し、リンパ節郭清を行う児玉法がある。", "e": "20〜30歳代で触診、画像上で境界明瞭な腫瘤があった場合、線維腺腫を考えて針生検はせずに経過観察で良い。"}, "correct": ["b", "c"], "explanation": "両側性・多孔性の乳白色分泌は主に良性（乳腺症など）です。また、マンモトームは吸引式で十分な組織量を採取できる生検装置です。", "image_url": "", "reference": "臨床", "tags": ["乳頭分泌", "マンモトーム生検", "線維腺腫"]}, {"id": "CL-19", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "授乳、出産は発癌のリスク増加となる。", "b": "センチネルリンパ節はTisN0M0、T2N0M0に行う。", "c": "乳房温存療法という場合は放射線治療も含めた治療全体を指している。", "d": "センチネルリンパ節はX線透視で確認でき、始めに到達するリンパ節である。", "e": "穿刺針組織診 (CNB)はやや太めの針を穿刺し、組織の一部を取り出して診断する方法である。"}, "correct": ["c", "e"], "explanation": "乳房温存療法は手術だけでなく術後の放射線照射を含めた治療概念です。また、CNBは太針を用いて病理組織診断を行う手法です。", "image_url": "", "reference": "臨床", "tags": ["乳房温存療法", "CNB", "センチネルリンパ節"]}, {"id": "CL-20", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。", "choices": {"a": "CMF療法とは抗癌剤を使用した化学療法である。", "b": "ビスホスホネート療法は溶骨性骨転移に対する治療法である。", "c": "乳癌の化学療法にはアンスラサイクリン系が使用されている。", "d": "HER2陽性の乳癌は治療に対する反応が良く、予後良好である。", "e": "乳癌の脳転移には多くの場合、放射線治療が治療の主体となる。"}, "correct": ["d"], "explanation": "HER2陽性乳癌は細胞増殖が速く早期に再発・転移しやすいため、従来は予後不良と考えられていました（抗HER2薬の適応対象）。", "image_url": "", "reference": "臨床", "tags": ["CMF療法", "ビスホスホネート", "HER2"]}, {"id": "CL-21", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "視診で皮膚の陥凹を認める場合をdellという。", "b": "リンパに転移していなくても遠隔転移することがある。", "c": "乳腺内に多発する腫瘍の場合は最も小さいTを用いて評価する。", "d": "単孔性の血性分泌物乳頭分泌は80％以上悪性を疑う。", "e": "乳頭異常分泌腫瘤は最終病理診断によってTis、T1miなどに確定分類する。"}, "correct": ["c", "d"], "explanation": "多発腫瘍の場合は「最も大きい腫瘍のサイズ」でT判定を行います。また、単孔性血性分泌で実際に悪性（乳癌）である割合は10%未満程度です。", "image_url": "", "reference": "臨床", "tags": ["TNM分類", "乳頭分泌", "dell"]}, {"id": "CL-22", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "授乳、出産は発癌のリスク減少となる。", "b": "皮膚の発赤を認める場合は悪性の可能性が高い。", "c": "単孔性の乳頭分泌は悪性を疑うのは10％未満である。", "d": "母姉妹が乳癌であるなら乳癌リスクになるとは限らない。", "e": "腋窩リンパ節は組織学的にLevel Ⅰ、Ⅱの2つに分類される。"}, "correct": ["a", "c"], "explanation": "授乳や出産はエストロゲン曝露を減らすため発癌リスクを低下させます。また、単孔性乳頭分泌で悪性が検出される割合は10%未満です。", "image_url": "", "reference": "臨床", "tags": ["危険因子", "乳頭分泌", "腋窩リンパ節レベル"]}, {"id": "CL-23", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "えくぼ症状は外傷や手術後にもみられる。", "b": "血性分泌物の起因は非浸潤性乳管癌がほとんどである。", "c": "NTD(乳頭腫瘤間距離)があれば乳房温存が可能である。", "d": "乳房皮膚の発赤では乳腺炎、乳輪下膿瘍などの炎症性疾患を第一に考える。", "e": "びまん性の微小円形石灰化があるとき太針生検ではなく、吸引穿刺針生検を行う。"}, "correct": ["b", "e"], "explanation": "血性分泌物の最も頻度の高い原因は乳管内乳頭腫（良性）です。また、良性の可能性が高い領域性・びまん性の微小円形石灰化は生検適応外となります。", "image_url": "", "reference": "臨床", "tags": ["血性分泌", "NTD", "微小石灰化"]}, {"id": "CL-24", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "次のうち正しいのはどれか。2つ選べ。", "choices": {"a": "粘液癌はUSでコメットサインを呈する。", "b": "腫瘤はマンモグラフィーより超音波検査の方が良い。", "c": "硬化性腺症はMMGだけでなくエコーでも構築の乱れを確認できる。", "d": "非浸潤癌や炎症性乳癌はMMGとUSを併用すると良悪性の判定ができる。", "e": "非浸潤癌の診断はマンモグラフィー、超音波検査を組み合わせれば容易である。"}, "correct": ["b", "c"], "explanation": "腫瘤性病変の検出・精査には超音波検査（US）が優れています。また、硬化性腺症はマンモグラフィ・超音波ともに構築の乱れとして描出されることがあります。", "image_url": "", "reference": "臨床", "tags": ["超音波検査", "硬化性腺症", "マンモグラフィ"]}, {"id": "CL-25", "category": "乳腺の基礎知識", "subcategory": "臨床", "question": "ステレオガイド下マンモトーム生検の適応でないのはどれか。", "choices": {"a": "悪性の可能性のある石灰化。", "b": "領域性で微小円形の石灰化。", "c": "石灰化以外の悪性を疑う病変。", "d": "良性と考えられるが組織診断を必要とする石灰化。", "e": "死亡率推移", "非浸潤癌発見率"]}, {"id": "BS-18", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "次のうち誤っているのはどれか。", "choices": {"a": "術後のマンモグラフィ検診は有用である。", "b": "日本では乳癌の罹患率は現在も増え続けている。", "c": "豊胸術者の乳がん検診では最適乳房圧は80Nである。", "d": "40歳未満では死亡率減少効果を判断することはできない。", "e": "陽性反応的中度は検診の有効性を比較する指標にならない。"}, "correct": ["c"], "explanation": "豊胸術実施者は破損や描出能低下の問題から、対策型検診（マンモグラフィ）は原則対象外となります。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["術後検診", "豊胸術", "適応外", "陽性反応的中度"]}, {"id": "BS-19", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "次のうち誤っているのはどれか。", "choices": {"a": "特異度が高いと偽陰性も増える。", "b": "感度が上がると真陽性率が上がる。", "c": "特異度が上がると真陰性率が上がる。", "d": "感度・特異度は有病率に影響される。", "e": "陽性反応適中率は有徴正診率ともいわれている。"}, "correct": ["d"], "explanation": "感度および特異度は有病率の影響を受けない独自の検査指標です。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["感度", "特異度", "有病率", "有徴正診率"]}, {"id": "BS-20", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "次のうち誤っているのはどれか。", "choices": {"a": "陽性反応的中度は有病率に左右される。", "b": "要精検受診率は精検が必要な人の割合である。", "c": "乳癌検診ではマンモグラフィの二重読影は確立されている。", "d": "要精検率とは1次検診を受けた人のうち精密検査が必要な人の割合である。", "e": "有病率とは一時点において特定の集団の中で状態にある対象者の割合である。"}, "correct": ["b"], "explanation": "「要精検受診率」ではなく「精検受診率」が「要精検者のうち精密検査を受診した割合」であり、要精検率は1次検診受診者のうち要精検となった割合です。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["要精検率", "精検受診率", "二重読影", "有病率"]}, {"id": "BS-21", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "若い人の乳癌の罹患が増えている。", "b": "高齢化の影響で乳癌罹患率は増えている。", "c": "日本の癌年齢調整罹患率は乳癌が5位である。", "d": "乳癌罹患率は欧米並みに日本も減少している。", "e": "乳癌検診では30歳代は検診しないことになってる。"}, "correct": ["c", "d"], "explanation": "日本の女性の癌年齢調整罹患率は乳癌が第1位であり、また罹患率は減少しておらず増加傾向にあります。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["年齢調整罹患率", "罹患率推移", "対象年齢"]}, {"id": "BS-22", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "乳癌リスクについて誤っているのはどれか。2つ選べ。", "choices": {"a": "家族性は乳癌リスクである。", "b": "乳腺症は乳癌リスクである。", "c": "線維腺腫は乳癌リスクである。", "d": "エストロゲンの影響を受けない。", "e": "硬化性腺症は乳癌リスクではない。"}, "correct": ["d", "e"], "explanation": "乳癌はエストロゲン（女性ホルモン）の強い影響を受けます。また、硬化性腺症は軽度ながら乳癌リスクを高めるとされています（線維腺腫は非増殖性病変でありリスクを上げません）。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["リスク因子", "エストロゲン", "硬化性腺症", "線維腺腫"]}, {"id": "BS-23", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "日本の乳癌罹患年齢は高齢側へシフトしている。", "b": "死亡率には粗死亡率と年齢調整死亡率の2種類ある。", "c": "授乳中の人も積極的に乳癌検診を受けるべきである。", "d": "乳癌検診ではマンモグラフィの二重読影は確立されている。", "e": "40歳代の乳癌検診では問診・触診・マンモグラフィ・超音波検査を行う。"}, "correct": ["c", "e"], "explanation": "授乳中の女性は高濃度乳腺となり適正な判定が困難なため検診対象外です。また、現在の対策型検診の標準項目に超音波検査は含まれません。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["授乳中検診", "対策型検診項目", "超音波検査"]}, {"id": "BS-24", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "乳癌検診は隔年で超音波を併用する。", "b": "感度が下がると中間期乳癌が多くなる。", "c": "陽性反応的中率には感度が大切で特異度は必要ない。", "d": "乳癌検診受診率の算定の対象年齢は40歳～69歳である。", "e": "乳癌検診で見つかる早期乳癌の割合は日本よりアメリカのほうが多い。"}, "correct": ["a", "c"], "explanation": "乳癌検診（対策型）で超音波併用は推奨されていません。また、陽性反応的中率を算出・維持するには感度だけでなく特異度も不可欠です。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["超音波併用", "中間期癌", "陽性反応的中率", "特異度"]}, {"id": "BS-25", "category": "乳がん検診、性能、画像評価", "subcategory": "乳がん検診と現状", "question": "次のうち誤っているものはどれか。2つ選べ。", "choices": {"a": "特異度が下がると要精検率は高くなる。", "b": "欧米での死亡率は上昇傾向にある。", "c": "わが国の年齢調整死亡率は乳癌が第4位(2020年)である。", "d": "乳癌検診でペースメーカーがある場合は慎重に圧迫するべきである。", "e": "乳癌検診では40～50歳未満はCCとMLOの2方向撮影を2年に1度行う。"}, "correct": ["b", "d"], "explanation": "欧米の乳癌死亡率は減少傾向にあります。また、ペースメーカー装着者は機器破損やリード離脱などの安全性の観点から乳がん検診（マンモグラフィ）は不適応（対象外）です。", "image_url": "", "reference": "乳がん検診.pdf", "tags": ["特異度", "要精検率", "欧米死亡率", "ペースメーカー"]}, {"id": "PE-01", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "Cアームはどのような場合でも固定は解除されない。", "b": "シャウカステンの輝度は 12000cd/㎡以上が望ましい。", "c": "コリメータに光照射ランプを内蔵する X 線装置は最大 SID で 100lx 以上とする。", "d": "管電圧の測定は少なくとも 25 ～ 32kV の範囲を 1kV 以下の調整段階で設定できること。", "e": "X 線管の焦点は受診者の胸壁に接する受像器面の縁にできる限り垂直に入射するように配置する。"}, "correct": ["b"], "explanation": "シャウカステンの輝度は中心点の輝度が 3500cd/㎡以上（ISO5880：透過 X 線の濃度 2.0 まで読影可能な 3000cd/㎡を必要最小基準とし、濃度 2.5 は 10000cd/㎡）が望ましい。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["シャウカステン", "Cアーム", "管電圧"]}, {"id": "PE-02", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "圧迫圧の表示誤差は± 20N 以内とする。", "b": "光照射野と X 線照射野のズレは SID2 ％以内である。", "c": "電動または空気圧などで行う乳房圧迫操作は、 70N 以下の加圧調整操作ができること。", "d": "AEC の検出器は線質 (管電圧 )依存性があるので、管電圧に対する撮影時間を補正する機能を備える。", "e": "焦点、ターゲット、および付加フィルタが自動選択される装置の場合は、 X 線照射完了前に表示する。"}, "correct": ["e"], "explanation": "焦点、ターゲット、および付加フィルタが自動選択される装置の場合は、X 線照射開始前に表示する（完了前ではない）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["圧迫圧", "AEC", "照射野"]}, {"id": "PE-03", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "すべての受像器サイズに適した固定グリッドであること。", "b": "AEC 検出器は少なくとも胸壁から乳頭方向に移動できること。", "c": "Ｘ線から放射されるＸ線線量の再現性は変動係数が 0.05 以下であること。", "d": "mAs の設定または mA、撮影時間の少なくとも、どちらか一方のマニュアル設定ができること。", "e": "スクリーン・フィルムシステムを用いる X 線装置は、少なくとも 18 × 24cm および 24 × 30cm のフィルムが使用できる構造であること。"}, "correct": ["a"], "explanation": "すべての受像器サイズに適した「移動グリッド」であること（固定グリッドではない）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["グリッド", "AEC", "線量再現性"]}, {"id": "PE-04", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "移動型グリッド比は 4 ： 1 が良い。", "b": "MMG は通常撮影では必ずグリッドを使用する。", "c": "乳房 X 線焦点は一般的に大焦点は 0.3mm、小焦点は 0.1mm である。", "d": "マンモグラフィ X 線装置ではインバータ式 X 線高電圧装置が使用されている。", "e": "乳房圧迫操作は少なくとも 100N の加圧ができ、 200N を超える加圧ができないこと。"}, "correct": ["e"], "explanation": "乳房圧迫操作は「少なくとも 150N」の加圧ができ、200N を超える加圧ができないこと。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["グリッド比", "焦点サイズ", "圧迫圧"]}, {"id": "PE-05", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "移動型グリッド密度は 31 本 /cm が良い。", "b": "シャウカステンはマスキング機能を有すること。", "c": "同じ管電圧で乳房厚を 1cm 減らすと mAs 値は 1/2 になる。", "d": "X 線焦点の電子収束方法としてフラットエミッタ方式が使用されている。", "e": "マンモグラフィ X 線装置の X 線管放射窓にはリンデマンガラスが用いられている。"}, "correct": ["e"], "explanation": "マンモグラフィ X 線装置の X 線管放射窓には 0.8 ～ 1.0mm 程度のベリリウムが用いられている（リンデマンガラスは用いられない）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["放射窓", "ベリリウム", "フラットエミッタ"]}, {"id": "PE-06", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "乳房圧迫板にはメタクリチル酸メチル ( PMMA )が使用されている。", "b": "X 線管を陽極接地にすると焦点外 X 線が減少し、コントラストも向上する。", "c": "拡大撮影が行える X 線装置はグリッドが有効視野から除去できる操作ができること。", "d": "マンモグラフィ装置の常設総ろ過は、 0.5mmAl または 0.03mmMo 未満であってはならない。", "e": "MMG 用グリッドは軟 X 線領域で使用するため、中間物質にはエア・ギャップが使用されている。"}, "correct": ["a"], "explanation": "乳房圧迫板にはポリカーボネイト（X線吸収が少ない物質）が使用されている（PMMAではない）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["圧迫板", "陽極接地", "固有ろ過"]}, {"id": "PE-07", "category": "性能と画像評価", "subcategory": "機器", "question": "乳房装置の仕様基準について誤っているのはどれか。", "choices": {"a": "自動露出精度 ( AEC )を備えること。", "b": "AEC の精度の基準濃度は 1.0 である。", "c": "管電圧の表示精度は 5 ％以内である。", "d": "AEC の精度は管理幅± 0.15 以内である。", "e": "焦点サイズは 0.3mm のとき、 0.45 × 0.65mm 以内である。"}, "correct": ["b"], "explanation": "AEC の精度の基準濃度は 1.5 である。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["仕様基準", "AEC", "管電圧精度"]}, {"id": "PE-08", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "カセッテには炭素繊維強化プラスチックが使われている。", "b": "C アームは電源を切れた場合を除いて確実に固定されている。", "c": "グリッドの被覆材料には炭素繊維強化プラスチックが使われている。", "d": "停電や緊急の時、乳房圧迫圧の解除、退避ができるよう安全機構を備える。", "e": "電動または空気圧などで行う乳房圧迫操作はフットスイッチを設けること。"}, "correct": ["b"], "explanation": "C アームは電源が切れたり、復帰したりしても固定が解除されない（いかなる場合も解除されない）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["Cアーム", "CFRP", "安全機構"]}, {"id": "PE-09", "category": "性能と画像評価", "subcategory": "画像評価", "question": "次のうち誤っているのはどれか。", "choices": {"a": "不均一高濃度は乳腺内濃度が 50 ～ 60 ％程度である。", "b": "乳腺濃度が 1.0 を下回った場合にはコントラスト不良になる。", "c": "臨床で適正濃度を得るには ACR ファントムで 1.2 ～ 1.59 になるように濃度設定をすれば良い。", "d": "マンモグラムは乳房の構成により、脂肪性、乳腺散在、不均一高濃度、極めて高濃度の 4 つに分類される。", "e": "フィルムのベース濃度は濃度 4.0 以上、かつ露光量の濃度が濃度の増加をもたらす範囲で用いられることが必要である。"}, "correct": ["c"], "explanation": "臨床で適正濃度を得るには ACR ファントムで D = 1.7 ～ 1.9 になるように濃度設定をすれば良い（観察に適する乳腺部分の濃度が 1.2 ～ 1.59 である）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["乳腺濃度", "ACRファントム", "乳房構成"]}, {"id": "PE-10", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。", "choices": {"a": "マンモグラフィでは増感紙は薄いほうが良い。", "b": "粒状性は大胸筋や乳腺の高濃度部において評価しやすい。", "c": "臨床画像評価は乳腺散在、不均一高濃度、高濃度の 3 種類の画像により評価される。", "d": "デジタル画像の乳腺外コントラストは脂肪から皮膚面などのＸ線吸収が比較的低い領域でのコントラストを評価する。", "e": "デジタル画像の乳腺などのＸ線吸収が比較的低い領域と脂肪などのＸ線吸収が比較的高い領域でのコントラストを評価する。"}, "correct": ["e"], "explanation": "デジタル画像の乳腺などの X 線吸収が比較的「高い」領域（光学的低濃度）と脂肪などの X 線吸収が比較的「低い」領域でのコントラストを評価する（記述が逆）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["増感紙", "粒状性", "臨床画像評価"]}, {"id": "PE-11", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。2 つ選べ。", "choices": {"a": "電動で圧迫できるのは 120N までである。", "b": "高輝度シャウカステンは 10000cd/㎡でも良い。", "c": "マンモグラフィフィルムのベース濃度は 4.0 以上である。", "d": "乳腺適正濃度は 1.2 ～ 1.59 であり、透過度は 1/16 ～ 1/32 である。", "e": "マンモグラフィ読影室の照度はシャウカステンの近辺で 100lx 以下であることが望ましい。"}, "correct": ["a", "e"], "explanation": "（1）電動または空気圧などで行う乳房圧迫操作は、少なくとも 150N の加圧ができ、200N を超える加圧ができないこと。（5）読影室の照度はシャウカステン近辺で 50lx 以下であることが望ましい。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["圧迫圧", "読影室照度", "シャウカステン"]}, {"id": "PE-12", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。2 つ選べ。", "choices": {"a": "濃度計には校正期限はない。", "b": "MMG は集束型(直線)グリッドを使用している。", "c": "圧迫板は必ずフットスイッチは装備しなければならない。", "d": "濃度測定では測定点で拡散された光のうち平行光を測定する。", "e": "照射野サイズより乳房を載せる支持体サイズのほうが若干大きい。"}, "correct": ["a", "d"], "explanation": "（1）濃度計には校正期限がある。（4）濃度測定では測定点で拡散された光のうち「拡散光」を測定する（拡散濃度）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["濃度計", "拡散濃度", "グリッド"]}, {"id": "PE-13", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。2 つ選べ。", "choices": {"a": "圧迫圧の持続性は 1 分間で－ 10N 以内が望ましい。", "b": "Ｘ線出力の直線性試験の変動係数は 0.05 以下とする。", "c": "マンモグラフィ用グリッドの中間物質はアルミである。", "d": "マンモグラフィの圧迫機能はデッドマン式を用いている。", "e": "圧迫厚の表示精度は圧迫圧 100 ～ 120N のとき± 5mm 以内である。"}, "correct": ["b", "c"], "explanation": "（2）X 線出力の直線性試験は |X1 - X2| <= 0.10(X1 + X2) の式を満足すること。（3）マンモグラフィ用グリッドの中間物質はファイバ（紙）やエアギャップである（アルミではない）。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["直線性", "グリッド中間物質", "圧迫持続性"]}, {"id": "PE-14", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。2 つ選べ。", "choices": {"a": "C アームが一度固定されても操作者の介在なしでも解除できる。", "b": "X 線管装置の放射窓の材料は透過性の良いベリリウム( Be )とする。", "c": "AEC 作動時の表示は X 線照射前の設定条件を X 線照射前に表示する。", "d": "X 線画像処理装置はマンモグラフィ専用に設計されなければならない。", "e": "コリメータに光照射ランプを内蔵する X 線装置は最大 SID で 50lx 以上とする。"}, "correct": ["a", "e"], "explanation": "（1）C アームは操作者の介在なしには解除できない。（5）コリメータの照度は最大 SID で 100lx 以上とする。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["Cアーム", "コリメータ照度", "放射窓"]}, {"id": "PE-15", "category": "性能と画像評価", "subcategory": "機器", "question": "次のうち誤っているのはどれか。2 つ選べ。", "choices": {"a": "乳腺濃度測定は乳腺の最も低濃度部を測定する。", "b": "セーフライトの露光部と未露光部の濃度差は 0.1 以内である。", "c": "鮮鋭度はクーパー靱帯などの細かい線状構造、組織の境界、石灰化の辺縁などで判定する。", "d": "内外斜位方向撮影で inframammary fold が伸びていないということは乳房が下垂していることを意味する。", "e": "内外斜位方向撮影では左右対称にほぼ乳頭の高さまで写し込まれ、大胸筋がやや凸の弧を描いていることが要求される。"}, "correct": ["a", "b"], "explanation": "（1）乳腺濃度測定は乳腺の最も高濃度部（光学的には低濃度＝白い領域）を測定する。（2）セーフライトの露光部と未露光部の濃度差は 0.05 以内である。", "image_url": "", "reference": "精度管理マニュアル", "tags": ["乳腺濃度", "セーフライト", "鮮鋭度"]}, {"id": "D-01", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。", "choices": {"a": "標本化とは画素に分割する操作である。", "b": "量子化とは画像の濃淡を離散的にする操作である。", "c": "周波数処理とは鮮鋭度をコントロールすることをいう。", "d": "直接変換方式FPDは蛍光フラットパネルとも呼ばれている。", "e": "間接変換方式FPDはヨウ化セシウムの蛍光体を使用している。"}, "correct": ["d"], "explanation": "直接変換方式FPDは蛍光体（シンチレータ）を使用せず、アモルファスセレン（a-Se）によりX線を直接電荷に変換する。蛍光フラットパネルと呼ばれるのは間接変換方式FPDである。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "FPD", "標本化", "量子化", "周波数処理"]}, {"id": "D-02", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。", "choices": {"a": "空間周波数は低周波では粗い構造を呈示している。", "b": "CRでは周波数処理方法としてボケマスク処理を用いている。", "c": "検出器のエレメントが大きくなるほど空間分解能が向上する。", "d": "デジタル画像の検出素子delの長さdが小さいとボケが小さくなる。", "e": "aSeはCsIよりX線減弱係数が大きく、X線の量子変換効率に優れている。"}, "correct": ["c"], "explanation": "検出器のエレメント（del size）が小さくなるほど、微細な構造まで描出できるようになり空間分解能が向上する。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "空間分解能", "CR", "del", "a-Se"]}, {"id": "D-03", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "デジタルシステムについて誤っているのはどれか。", "choices": {"a": "標本化は空間分解能に影響する。", "b": "量子化は濃度分解能に影響する。", "c": "階調数は量子化する画素値の範囲である。", "d": "検出素子delの長さdが大きくなると空間分解能は良くなる。", "e": "微細な病変を検出するためには小さなサンプリング間隔が求められる。"}, "correct": ["d"], "explanation": "検出素子delの長さd（素子サイズ）が小さくなるほど空間分解能は良くなる（向上する）。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "標本化", "量子化", "del", "空間分解能"]}, {"id": "D-04", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。", "choices": {"a": "CRでは従来型のAECが必要である。", "b": "FPDは直接変換でも間接変換でもTFTを使用する。", "c": "CRシステムの蛍光物質はBaFX:Eu2+蛍光体である。", "d": "量子化は階調数が多いほど濃度差の小さいものを描出する。", "e": "CRシステムはCsIといわれるIP蛍光体を検出器に用いている。"}, "correct": ["e"], "explanation": "CRシステムのイメージングプレート（IP）に用いられる輝尽性蛍光体はBaFX:Eu2+（フッ化ハロゲン化バリウム）である。CsI（ヨウ化セシウム）は間接変換方式FPDなどのシンチレータとして用いられる。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "CR", "FPD", "IP", "BaFX:Eu2+", "CsI"]}, {"id": "D-05", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。", "choices": {"a": "IPのデータ読み取りには白色、データ消去には赤色を使う。", "b": "量子化はディジタル画像の濃度分解能を決定する因子である。", "c": "セレンフラットパネルシステムには蛍光体は使用されていない。", "d": "デジタル受光系ではフィルムでみられる黒とび、白とびが起こらない。", "e": "デジタルシステム感度は平面均一補正で不均一を取り除くことができる。"}, "correct": ["a"], "explanation": "IP（イメージングプレート）の潜像読み取りには赤色（レーザー光線）、残存エネルギーのデータ消去には白色光を使用する。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "IP", "量子化", "FPD", "平面均一補正"]}, {"id": "D-06", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。", "choices": {"a": "25μm/pixelは20LP/mmである。", "b": "50μm/pixelは40LP/mmである。", "c": "デジタルはアナログよりも濃度分解能が悪い。", "d": "デジタルはアナログよりも空間分解能が悪い。", "e": "白黒反転機能は反転することで石灰化像が観察しやすい場合がある。"}, "correct": ["b"], "explanation": "50μm（0.05mm）ピクセルサイズにおける限界空間周波数（ナイキスト周波数）は 1 / (2 × 0.05mm) = 10 LP/mm である。（40LP/mmではなく10LP/mm）", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "ピクセルサイズ", "空間周波数", "ナイキスト周波数"]}, {"id": "D-07", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。", "choices": {"a": "DQEは(SNR出力)^2 / (SNR入力)^2表である。", "b": "ダイナミックレンジとは入力に対する出力の飽和度を表す。", "c": "ダイナミックレンジとはシステムが許容できる入力量の幅を表す。", "d": "DQEとはSNRの概念から導かれた画像の物理的評価のひとつである。", "e": "DQEは画質評価の指標として用いられ、画像入力系の検出効率に相当する。"}, "correct": ["b"], "explanation": "ダイナミックレンジとは、システムが識別・許容できる入力量（信号）の最小値から最大値までの幅を表す指標であり、「出力の飽和度」を表すものではない。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "DQE", "SNR", "ダイナミックレンジ"]}, {"id": "D-08", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "量子変換効率について誤っているのはどれか。", "choices": {"a": "照射線量が少なすぎても多すぎても低下する。", "b": "SN比は線量増加と共にDQEの値が大きくなるほど大きくなる。", "c": "ヨウ化セシウムのほうが硫酸化ガドリニウムより高いDQEを示す。", "d": "ヨウ化セシウムはX線吸収率を高めるために蛍光体を薄くすることができる。", "e": "DQEはシステムにした入力SNRの2乗に対する出力SNRの2乗で定義される。"}, "correct": ["d"], "explanation": "ヨウ化セシウム（CsI）は柱状結晶構造を持ち、光の散乱（拡散）を抑えられるため、X線吸収率を高める目的で蛍光体を「厚く」することができる。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "DQE", "CsI", "量子変換効率"]}, {"id": "D-09", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "アナログよりデジタルの方が粒状性が良い。", "b": "アナログよりデジタルの方がスループットが高い。", "c": "アナログよりデジタルの方がダイナミックレンジが広い。", "d": "アナログもデジタルも階調処理はコントラストと関係がある。", "e": "アナログよりデジタルの方が量子ノイズ(量子モトル)の影響を受けやすい。"}, "correct": ["a", "d"], "explanation": "（1）画素サイズの影響により、アナログよりもデジタルの方が粒状性が悪い。（4）アナログ（フィルム・増感紙系）では撮影後に階調処理を行うことはできない（階調処理ができるのはデジタルである）。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "アナログ比較", "粒状性", "階調処理", "スループット"]}, {"id": "D-10", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "データ量とは画素数×階調度である。", "b": "画像の細かさは画素数(ビット)で表す。", "c": "データ量とは「総画素数×階調度」である。", "d": "階調数Nとビットb関係の式はbの2乗である。", "e": "画像容量においてはデータ量≧ファイル量である。"}, "correct": ["d", "e"], "explanation": "（4）階調数Nとビット数bの関係は N = 2^b （2のb乗）である。（5）ヘッダ情報などが付加されるため、実際のファイル量はデータ量以上（ファイル量 ≧ データ量）となる。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "データ量", "ビット", "階調数", "ファイル量"]}, {"id": "D-11", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "a-Se、a-Siは結晶構造をしている。", "b": "シンチレータ(CsI)は円柱の構造をしている。", "c": "直接、間接変換FPDとも電荷に変換している。", "d": "FPDで直接型より間接型の方が空間分解能が良い。", "e": "間接変換方式FPDではX線→CsI→光→A-Si→電子→TFTに伝達される。"}, "correct": ["a", "d"], "explanation": "（1）a-Se（アモルファスセレン）、a-Si（アモルファスシリコン）の「a-」はアモルファス（非晶質）を意味し、非結晶構造である。（4）直接変換型FPDは光拡散のプロセスがないため、間接変換型よりも空間分解能に優れる。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "FPD", "アモルファス", "直接変換", "間接変換"]}, {"id": "D-12", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "100μm/pixelは10LP/mmである｡", "b": "CRの蛍光体にはBaFBr:Euが使用されている。", "c": "デジタルシステムの空間分解能はピクセルサイズに従う。", "d": "直接FPDではX線→ASe→正孔→TFT→電気信号である。", "e": "ダイナミックレンジは入力と出力が飽和しない程度の入力量を指す。"}, "correct": ["a", "e"], "explanation": "（1）100μm（0.1mm）ピクセルサイズにおける限界空間周波数は 1 / (2 × 0.1mm) = 5 LP/mm である。（5）ダイナミックレンジはシステムが識別・許容できる入力量の幅（範囲）を表す。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "ピクセルサイズ", "空間分解能", "ダイナミックレンジ"]}, {"id": "D-13", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "CRで濃度を上げるのは周波数特性である。", "b": "階調数を多くするとアナログの画像に近くなる。", "c": "階調処理はザラツキのバランスを改善する処理である。", "d": "DQEはアナログとの対比、デジタル同士の評価に用いられる。", "e": "CRTモニタで画像を観察するときに行う処理をウインドーイングという。"}, "correct": ["a", "c"], "explanation": "（1）濃度やコントラストの調節を行うのは階調処理である。（3）ザラツキ（粒状性・ノイズ）や鮮鋭度のバランスをコントロールするのは周波数処理である。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "階調処理", "周波数処理", "ウインドーイング", "DQE"]}, {"id": "D-14", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "IPの蛍光体は硫化ガドリニウムを使っている。", "b": "間接変換方式DRは透過したX線を一度光に変換する。", "c": "直接変換方式FPDのシンチレータ(CsI)は柱状結晶の構造である。", "d": "直接および間接変換方式に使われているa-Se、a-Siは非晶質である。", "e": "FPDに使われているTFT薄層トランジスタでスイッチングが行われている。"}, "correct": ["a", "c"], "explanation": "（1）IPの輝尽性蛍光体にはフッ化ハロゲン化バリウム（BaFX:Eu2+）が用いられる。硫酸化ガドリニウム（Gd2O2S）は増感紙用蛍光体である。（3）CsIシンチレータは間接変換方式FPDに用いられる（直接変換方式ではシンチレータを使用しない）。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "IP", "シンチレータ", "CsI", "TFT"]}, {"id": "D-15", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "マンモグラフィ読影用モニタについて誤っているのはどれか。2つ選べ。", "choices": {"a": "モニタの清掃は日常点検である。", "b": "モニタの読影はピクセル等倍表示で行うのが良い。", "c": "2MPモニタはマンモグラフィの読影に適している。", "d": "マンモグラフィ用モニタの輝度は300～400cd/m2である。", "e": "モニタのウィンドウ幅を狭くするとコントラストは良くなる。"}, "correct": ["c", "d"], "explanation": "（3）マンモグラフィ読影用モニタには高精細な5MP（5メガピクセル）モニタ（最低でも3MP以上）が推奨される。（4）マンモグラフィ用モニタの推奨最高輝度は500～600 cd/m2（または400 cd/m2以上）と高く規定されている。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "読影用モニタ", "5MP", "輝度", "ピクセル等倍表示"]}, {"id": "D-16", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "CRTモニタの特徴について誤っているのはどれか。2つ選べ。", "choices": {"a": "視野角が狭い。", "b": "動画再生に優れている。", "c": "地磁気の影響を受ける。", "d": "周囲光を明るくして使用する。", "e": "鮮鋭度は周囲光方向の応答特性にのみ影響する。"}, "correct": ["a", "d"], "explanation": "（1）CRTモニタは視野角が広いのが特徴である。（4）CRTモニタは外光の影響を受けやすいため、周囲光（外光）を暗くして使用する必要がある。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "CRTモニタ", "視野角", "周囲光"]}, {"id": "D-17", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "液晶(LCD)モニタの特徴について誤っているのはどれか。2つ選べ。", "choices": {"a": "黒が浮く。", "b": "歪みがない。", "c": "視野角が広い。", "d": "画像がちらつく。", "e": "残像現象が発生する。"}, "correct": ["c", "d"], "explanation": "（3）液晶モニタはCRTと比較して視野角が狭い（角度によって色・階調が変化する）。（4）液晶モニタは画面のちらつき（フリッカー）が起こりにくい特性を持つ。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "液晶モニタ", "LCD", "視野角", "黒浮き"]}, {"id": "D-18", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち関係のない組み合わせはどれか。", "choices": {"a": "加算的ラグ効果 － 残像現象", "b": "グレースケール － 白、黒、灰色", "c": "コントラスト － CNR", "d": "パッチ － 画像のちらつき", "e": "電気・電子技術 － IEC"}, "correct": ["d"], "explanation": "パッチ（patch）とは画像の一部分（領域）のことを指す。画像のちらつきはフリッカー（flicker）と呼ばれる。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "ラグ効果", "CNR", "IEC", "用語"]}, {"id": "D-19", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち関係のない組み合わせはどれか。", "choices": {"a": "乗算的ラグ効果 － 感度", "b": "P値 － 画素値", "c": "モニタ － TG18Q-QC", "d": "階調特性 － GSDF", "e": "空間分解能 － SCTF"}, "correct": ["b"], "explanation": "P値（Presentation Value）はDICOM規格において知覚的に線形化された表示値（入力値）のことであり、単なる画像の画素値そのものを直接指すものではない。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "P値", "GSDF", "SCTF", "TG18"]}, {"id": "D-20", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "次のうち関係のない組み合わせはどれか。", "choices": {"a": "クロストーク － CRT", "b": "オーバーシュート － 白強調", "c": "ゴースト － 多重画像", "d": "システム感度 － 照射線量", "e": "シャドー － コントラスト"}, "correct": ["a"], "explanation": "クロストーク（crosstalk）は液晶（LCD）パネルにおいて隣接する駆動回路からの信号漏れにより発生する現象であり、CRTに関する現象ではない。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "クロストーク", "LCD", "オーバーシュート", "ゴースト"]}, {"id": "D-21", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "CRTモニタについて誤っているのはどれか。2つ選べ。", "choices": {"a": "電子ビームの強度を上げると鮮鋭度が良くなる。", "b": "暗室における黒の表示が得意あり、外光の影響を受けにくい。", "c": "表示画像にはカラーとグレースケール(モノクロ)が使い分けられている。", "d": "電気信号を光に変換し人間の目に見える像をデバイス画面上に表示させる。", "e": "電子ビームの強弱により明るさを変調し画像を表示する自発光デバイスである。"}, "correct": ["a", "b"], "explanation": "（1）電子ビームの強度を上げすぎるとビーム径が太くなり鮮鋭度は低下する。（2）暗室における黒の表示は得意であるが、画面の拡散反射が大きいため外光（周囲光）の影響を受けやすい。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "CRT", "電子ビーム", "鮮鋭度", "周囲光"]}, {"id": "D-22", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "液晶(LCD)モニタについて誤っているのはどれか。2つ選べ。", "choices": {"a": "内部反射が大きい。", "b": "画素欠点が存在する。", "c": "応答速度が早く、動画表示に優れている。", "d": "光の透過率を増減させることで画像を表示する構造になっている。", "e": "光源であるバックライトの光の透過度を変化させて画像を表示する他発光デバイスである。"}, "correct": ["a", "c"], "explanation": "（1）液晶モニタはCRTと比較して内部反射が小さい。（3）液晶モニタは原理的に応答速度が遅く、動画表示性能には劣る。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "LCD", "液晶", "応答速度", "他発光"]}, {"id": "D-23", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "医用画像表示用モニタについて誤っているのはどれか。2つ選べ。", "choices": {"a": "10ビットは256階調である。", "b": "横型(ランドスケープ)表示である。", "c": "デスプレイ上の各子の1マスは100ピクセルに相当する。", "d": "液晶ディスプレイの長期的な輝度低下の主原因はバックライトCCFLの劣化である。", "e": "コントラスト比はそのモニタの最高輝度(白)と最低輝度(黒)の輝度値の比で求められる。"}, "correct": ["a", "b"], "explanation": "（1）10ビットは 2^10 = 1024階調である（256階調は8ビット）。（2）マンモグラフィ読影用モニタは縦型（ポートレート）表示で使用される。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "医用モニタ", "階調", "ポートレート", "CCFL"]}, {"id": "D-24", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "CRTモニタについて誤っているのはどれか。", "choices": {"a": "定期試験は3ヶ月毎に行う。", "b": "5Mモニタのピクセルサイズは156μmである。", "c": "5Mモニタの推奨校正輝度は400～500cd/m2である。", "d": "5Mモニタの解像度(ピクセル数)は2560×2048である。", "e": "経時とともに電子銃(カソード)や蛍光体が劣化するため特性が変化する。"}, "correct": ["c"], "explanation": "5M CRTモニタの推奨校正輝度は 300～490 cd/m2（または最高輝度300cd/m2程度）である。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "CRT", "品質管理", "輝度"]}, {"id": "D-25", "category": "マンモグラフィの基礎", "subcategory": "デジタル", "question": "液晶(LCD)モニタについて誤っているのはどれか。", "choices": {"a": "5Mモニタのピクセルサイズは165μmである。", "b": "5Mモニタの推奨校正輝度は400～600cd/m2である。", "c": "5Mモニタの解像度(ピクセル数)は2048×1536である。", "d": "バックライトの輝度が上がると、最高輝度、最低輝度が同じ比率で上がる。", "e": "定期試験は6ヶ月毎に行い、輝度安定化回路を装着している場合は12ヶ月毎に行う。"}, "correct": ["c"], "explanation": "5Mモニタの解像度（ピクセル数）は 2560×2048 である（2048×1536は3Mモニタの解像度）。", "image_url": "", "reference": "マンモグラフィガイドライン", "tags": ["デジタル", "LCD", "解像度", "5Mモニタ", "品質管理"]}, {"id": "ES-01", "category": "マンモグラフィの基礎", "subcategory": "ターゲットとフィルタ", "question": "入射X線スペクトルについて誤っているのはどれか。", "choices": {"a": "Aはフィルターなしである。", "b": "A、B、Cの最大エネルギーは30keVである。", "c": "Bは被写体透過後の入射X線スペクトルである。", "d": "CはMoターゲット、Rhフィルタの入射X線スペクトルである。", "e": "AはMoターゲット、Moフィルタの入射X線スペクト subcategory": "機器", "question": "X線装置について誤っているのはどれか。", "choices": {"a": "ヒール効果が顕著に現れる。", "b": "リプル率が大きいとX線出力は小さい。", "c": "Ｘ線が不連続になるところを吸収端という。", "d": "連続X線のことを制動X線とも呼ばれている。", "e": "焦点サイズは乳頭側の方が胸壁側の方より大きくなる。"}, "correct": ["e"], "explanation": "焦点サイズは胸壁側の方が乳頭側の方より大きくなる。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["X線装置", "ヒール効果", "焦点"]}, {"id": "ES-06", "category": "マンモグラフィの基礎", "subcategory": "機器", "question": "X線装置について誤っているのはどれか。", "choices": {"a": "X線管から発生するX線は混合X線である。", "b": "フラットエミッタ方式は副焦点が形成されにくい。", "c": "X線管はアノード側を下に若干傾斜させて固定している。", "d": "放射口はX線管の先端部にあるユニポーラ型になっている。", "e": "インバータ式装置は商用電源の変動などに対して影響を受けにくい。"}, "correct": ["c"], "explanation": "X線管はカソード側を下に若干傾斜させて固定している。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["X線管", "インバータ", "構造"]}, {"id": "ES-07", "category": "マンモグラフィの基礎", "subcategory": "機器", "question": "X線装置について誤っているのはどれか。", "choices": {"a": "集束(直線)グリッドを使用している。", "b": "X線管を陰極接地にすると冷却効率が良い。", "c": "接地に対して片側の高電圧を印加する方式がとられている。", "d": "マンモグラフィ用X線管では陽極-陰極間距離を近づえている。", "e": "30kV以下の管電圧になると焦点サイズ以上にX線が広がってしまう。"}, "correct": ["b"], "explanation": "X線管を陽極接地にすると冷却効率が良い。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["X線管", "冷却効率", "グリッド"]}, {"id": "ES-08", "category": "マンモグラフィの基礎", "subcategory": "機器", "question": "X線装置について誤っているのはどれか。", "choices": {"a": "X線管公称管電圧は平均値(kV)である。", "b": "デジタルでも移動型グリッドを使用する。", "c": "0.1mm焦点では2倍の拡大率が限界である。", "d": "ヒール効果はターゲット角度が大きいほど小さい。", "e": "X線管から放出される最低エネルギーはX線装置の総ろ過によって決まる。"}, "correct": ["a"], "explanation": "X線管公称管電圧は波高値(kV)である。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["公称管電圧", "拡大撮影", "ろ過"]}, {"id": "ES-09", "category": "マンモグラフィの基礎", "subcategory": "機器", "question": "X線装置について誤っているのはどれか。", "choices": {"a": "特性X線は電子が遷移した時に発生する。", "b": "乳腺組織と皮膚の減弱係数は同じである。", "c": "Moターゲットの場合、4本の特性X線を発生する。", "d": "RhフィルタはMoフィルタより吸収端が高い。", "e": "入射X線スペクトルが低いエネルギー成分が多く含まれるほど被ばくが少ない。"}, "correct": ["e"], "explanation": "入射X線スペクトルが低いエネルギー成分が多く含まれるほど被ばくが多い。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["X線装置", "特性X線", "被ばく"]}, {"id": "ES-10", "category": "マンモグラフィの基礎", "subcategory": "ターゲットとフィルタ", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "Moは特性X線のみ発生させる。", "b": "K吸収端はMoよりRhの方が大きい。", "c": "連続X線のことを制動X線とも呼ばれている。", "d": "特性X線エネルギーはフィルターの影響を受ける。", "e": "第一半価層はフィルタ、管電圧、整流方式に依存する。"}, "correct": ["a", "d"], "explanation": "連続X線からなる混合X線を利用している。特性X線エネルギーはターゲット物質によって固有であり、フィルターの影響を受けない。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["特性X線", "吸収端", "フィルター"]}, {"id": "ES-11", "category": "マンモグラフィの基礎", "subcategory": "機器", "question": "X線装置について誤っているのはどれか。", "choices": {"a": "Rhは20.2keVと22.7keVの特性X線を発生する。", "b": "Mo/Moの場合の第1半価層と第2半価層は同じである。", "c": "特性X線は物質固有のエネルギーのみに発生する線スペクトルである。", "d": "同じ管電圧であれば、Mo/MoとMo/Rhの最高エネルギーは同じである。", "e": "実効焦点の大きさとはターゲットが電子に当たった面積が投影された実効焦点面積を指す。"}, "correct": ["b"], "explanation": "Mo/Moの場合の第1半価層より第2半価層のほうが厚い。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["X線装置", "半価層", "特性X線"]}, {"id": "ES-12", "category": "マンモグラフィの基礎", "subcategory": "X線の特性", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "K吸収端エネルギーはフィルタに依存する。", "b": "ヒール効果はSIDが大きいほど影響が大きい。", "c": "特性X線のエネルギーはターゲット物質により決まる。", "d": "診断用X線の特性X線はX線の画像形成に寄与している。", "e": "連続エネルギー分布をもつX線エネルギーを実効エネルギーと定義している。"}, "correct": ["b", "d"], "explanation": "ヒール効果はSIDが小さいほど影響が大きい。特性X線は全線束強度の10～20％でX線の画像形成にはほとんど寄与していない。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["ヒール効果", "特性X線", "実効エネルギー"]}, {"id": "ES-13", "category": "マンモグラフィの基礎", "subcategory": "X線の特性", "question": "特性X線について誤っているのはどれか。2つ選べ。", "choices": {"a": "KαとKβではKβの方が強度は強い。", "b": "KαとKβではKαの方が波長は短い。", "c": "KαとKβではKαの方が光子数は多い。", "d": "KαとKβではKβの方がエネルギーが大きい。", "e": "管電圧が大きくなると特性X線光子数が増加する。"}, "correct": ["a", "b"], "explanation": "KαはKβより遷移確率が高く強度(光子数)が大きいため、aの「Kβの方が強度は強い」は誤り。また、KβはKαより遷移エネルギーが大きく波長が短いため、bの「Kαの方が波長は短い」も誤り(正しくはKαの方が波長は長い)。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["特性X線", "Kα", "Kβ"]}, {"id": "ES-14", "category": "マンモグラフィの基礎", " 散乱線が入るとHVLは大きくなる。", "b": "陽極回転数は3倍回転で8000～9000rpmである。", "c": "精密にみるために通常のMMG検査では小焦点を選択する。", "d": "MMG用X線管はアノード側を下に若干傾斜させて固定している。", "e": "エミッション特性はX線管球の陽極－陰極間を近づけることで改善される。"}, "correct": ["c", "d"], "explanation": "通常のMMG検査では大焦点を選択する。MMG用X線管はカソード側を下に若干傾斜させて固定している。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["半価層", "焦点", "X線管"]}, {"id": "ES-19", "category": "マンモグラフィの基礎", "subcategory": "機器", "question": "AECについて誤っているのはどれか。2つ選べ。", "choices": {"a": "半導体検出器が主流である。", "b": "X線放出側に受光部がある。", "c": "大きさは小さいほうが精度が良い。", "d": "圧迫板の表示と実際の検出器の大きさは同じではない。", "e": "大きさや形はメーカーや同一メーカーでも装置によっても違うことがある。"}, "correct": ["b", "c"], "explanation": "X線受光部はX線射出側にある。大きさは小さすぎると線量不足になるため一概に小さい方が良いとは言えない。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["AEC", "受光部", "検出器"]}, {"id": "ES-20", "category": "マンモグラフィの基礎", "subcategory": "機器", "question": "マンモグラフィX線装置について誤っているのはどれか。2つ選べ。", "choices": {"a": "グリッドの中間物質はアルミである。", "b": "集束型(直線)グリッドを使用している。", "c": "Cアームはどのような場合でも固定は解除されない。", "d": "線吸収係数は乳腺組織の方が乳癌組織に比べて少し小さい。", "e": "支持台、圧迫板、カセッテホルダに使用されている素材はポリカーボネイトである。"}, "correct": ["a", "e"], "explanation": "グリッドの中間物質はファイバ(紙)等である。支持台や圧迫板等には炭素繊維強化プラスチック(CFRP)等を使用する。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["グリッド", "圧迫板", "素材"]}, {"id": "ES-21", "category": "マンモグラフィの基礎", "subcategory": "X線の特性", "question": "X線の線質に影響しないのはどれか。", "choices": {"a": "管電圧", "b": "管電流", "c": "焦点の材質", "d": "フィルター", "e": "焦点の大きさ"}, "correct": ["b"], "explanation": "管電流はX線の線質に影響しない。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["線質", "管電流", "管電圧"]}, {"id": "ES-22", "category": "マンモグラフィの基礎", "subcategory": "X線の特性", "question": "特性X線について誤っているのはどれか。2つ選べ。", "choices": {"a": "Kα、βの横につく数字は強度を表す。", "b": "放出確率はKα線の方がβ線より大きい。", "c": "エネルギーはターゲット物質により決まる。", "d": "管電圧が大きくなると特性X線光子数が減少する。", "e": "Kα、β、γになるにつれてエネルギーが減少する。"}, "correct": ["d", "e"], "explanation": "管電圧が大きくなると特性X線光子数は増加する。エネルギーはKα、β、γになるにつれて増加する。", "image_url": "", "reference": "マンモグラフィ品質管理マニュアル", "tags": ["特性X線", "強度", 一定濃度に必要な露光量と感度は反比例する（少ない露光量で同じ濃度が得られる方が感度が高い）。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-08", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "粒状性と感度は反比例する。", "b": "感度と鮮鋭度は反比例する。", "c": "鮮鋭度と粒状性は反比例する。", "d": "コントラストと粒状性は比例する。", "e": "コントラストと鮮鋭度は反比例する。"}, "correct": ["d", "e"], "explanation": "コントラストと粒状性は反比例し、コントラストと鮮鋭度は比例関係にある。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-09", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。", "choices": {"a": "写真濃度はX線フィルムの不透過度の対数で表す。", "b": "フィルムの写真濃度を2枚重ねたときの濃度は2.0である。", "c": "写真濃度1とは透過光が入射光の1％になる場合の濃度である。", "d": "写真濃度0.3とは透過光が入射光の50％になる場合の濃度である。", "e": "写真濃度とは支持体 (ベース)の着色濃度と黒化銀濃度との合計である。"}, "correct": ["c"], "explanation": "写真濃度は入射光を透過光で割った対数値＝不透過度の対数＝透過率の逆数。写真濃度1とは入射光の10％（透過率10％）が透過、または90％が吸収される場合の濃度である。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-10", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。", "choices": {"a": "増感紙の中間層にはポリエチレンテレフタレートが用いられてる。", "b": "増感紙の蛍光体は硫酸ガドミウム・テルビウムが使用されている。", "c": "フィルムの支持体にはポリエチレンテレフタレートが用いられてる。", "d": "フィルムは長波側の光 (緑～黄)までを感光するように使用されている。", "e": "増感紙の蛍光体は主発光色は緑色であるが、弱い青色発光も含まれている。"}, "correct": ["a"], "explanation": "増感紙の保護層には透明なセルロース化合物やポリエチレンテレフタレートが用いられ、中間層は支持体と蛍光体層を接着させる役割と蛍光の拡散、反射を防ぐ役割を持つ。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-11", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。", "choices": {"a": "増感紙の主発光色は緑色発色である。", "b": "線吸収係数が大きいほど写真濃度は低い。", "c": "フィルムはカセッテのフロント側にバック層がある。", "d": "蛍光体をバックにするのは感度を犠牲にして鮮鋭度を高くするためである。", "e": "潜像退行とは、経時変化によって現像後のフィルム濃度が照射直後の濃度の変化に比べて低下する現象のことをいう。"}, "correct": ["c"], "explanation": "フィルムはカセッテのバック側に配置され、フロント側にはフィルムが装填される。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-12", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。", "choices": {"a": "特性曲線の濃度3は濃度1の1000倍の露光量である。", "b": "特性曲線の濃度4は濃度1の10000倍の露光量である。", "c": "写真濃度2のフィルムを2枚重ねると濃度は4になる。", "d": "特性曲線を積分するとグラジエントカーブが得られる。", "e": "Ｘ線写真の濃度測定に通常使用される濃度計は拡散濃度計である。"}, "correct": ["d"], "explanation": "特性曲線を微分するとグラジエントカーブが得られる。積分すると特性曲線に戻る。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-13", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "増感紙構造モトルは感度に依存する。", "b": "増感紙の感度が高くなると量子モトルが減少する。", "c": "相反則不軌とはフィルムの感度長時間の露出などにより低下することをいう。", "d": "画像コントラストには被写体コントラストとフィルムコントラストが影響する。", "e": "Ｘ線写真モトルを大きく分けるとＸ線量子モトル、増感紙の構造モトル、フィルムの粒状に分けられる。"}, "correct": ["a", "b"], "explanation": "増感紙構造モトルは蛍光体粒子径などに依存し、増感紙の感度が高くなると量子モトルは増加（影響が大きく）なる。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-14", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "粒状性は焦点の大きさが大きいほど良い。", "b": "潜像退行はフィルムの種類にも影響される。", "c": "乳腺内コントラストは管電圧を下げると改善される。", "d": "コントラストが高くなると粒状性と鮮鋭度は悪くなる。", "e": "平均階調度(G)は特性曲線のカブリ＋0.25～カブリ＋2.0を結んだ線と横軸のなす角度(θ)を(G=tanθ)で表す。"}, "correct": ["a", "d"], "explanation": "焦点が大きいと粒状性は悪くなり、コントラストが高くなると粒状性は悪くなるが鮮鋭度は良くなる。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-15", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "次のうち誤っているのはどれか。2つ選べ。", "choices": {"a": "乳房用フィルムは感光系の緑色を使用する。", "b": "一定濃度に必要な露光量と感度とは比例する。", "c": "増感紙の蛍光体は硫化ガドリニウムを使っている。", "d": "オルソ系増感紙はレギュラー増感紙よりも検出能が高い。", "e": "被写体コントラストに影響を与えるものは幾何学的ボケである。"}, "correct": ["b", "e"], "explanation": "一定濃度に必要な露光量と感度は反比例し、幾何学的ボケは鮮鋭度に影響を与えるもので被写体コントラストの因子ではない。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-16", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "鮮鋭度について誤っているのはどれか。2つ選べ。", "choices": {"a": "高感度増感紙ほど鮮鋭度は悪くなる。", "b": "被写体の動きにより鮮鋭度が低下する。", "c": "鮮鋭度を良くするにはＸ線管焦点を大きくする。", "d": "焦点・フィルム間距離を短くすると鮮鋭度が向上する。", "e": "鮮鋭度低下の要因は幾何学的不鋭、感光材料による不鋭である。"}, "correct": ["c", "d"], "explanation": "鮮鋭度を良くするにはＸ線管焦点を小さくし、焦点・フィルム間距離は長くすると鮮鋭度が向上する。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-17", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "粒状性について誤っているのはどれか。2つ選べ。", "choices": {"a": "濃度により変化しない。", "b": "低温現像処理をすると向上する。", "c": "フィルム乳材の形状や大きさに影響されない。", "d": "量子モトルは増感紙蛍光体に入射するＸ線量子数に関係する。", "e": "増感紙の構造モトルは蛍光体層の厚さ、粒子径の均一性、分布に影響される。"}, "correct": ["a", "c"], "explanation": "粒状性は濃度により変化し、フィルム乳剤の形状や大きさに影響される。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-18", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "被写体コントラストの因子でないのはどれか。2つ選べ。", "choices": {"a": "管電流散", "b": "線減弱係数", "c": "乱線の有無", "d": "被写体の厚さ", "e": "焦点の大きさ"}, "correct": ["a", "e"], "explanation": "管電流や焦点の大きさは被写体コントラストに影響しない因子である。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-19", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "散乱線を減らすのに関与しないのはどれか。2つ選べ。", "choices": {"a": "圧迫する。", "b": "管電圧を下げる。", "c": "グリッド比を大きくする。", "d": "照射野の面積を大きくする。", "e": "被写体とフィルムの距離を縮める。"}, "correct": ["d", "e"], "explanation": "照射野の面積は小さくし、被写体とフィルムの距離は縮める（または離さない）ことが散乱線低減に関与する。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "PC-20", "category": "マンモグラフィの基礎", "subcategory": "写真特性", "question": "画像コントラストを高める因子で正しいのはどれか。2つ選べ。", "choices": {"a": "管電流を下げる。", "b": "管電圧を下げる。", "c": "撮影距離を長くする。", "d": "付加フィルタを厚くする。", "e": "ガンマの高いフィルムを用いる。"}, "correct": ["b", "e"], "explanation": "管電圧を下げ、ガンマの高いフィルムを用いることが画像（Ｘ線写真）コントラストを高める因子である。", "image_url": "", "reference": "", "tags": ["写真特性"]}, {"id": "QM1-01", "category": "精度管理マニュアル2023対応", "subcategory": "X線の特性", "question": "誤っているのはどれか。すべて選べ。", "choices": {"a": "低い線エネルギー成分が多く含めれるほど被ばくが少なくなる。", "b": "高い線エネルギー成分が多く含まれるほどコントラストが低くなる。", "c": "X線スペクトルは光子エネルギーに対するX線強度分布をとったものである。", "d": "X線強度分布(ヒール効果)はカソード(陰極)の方が強い不均一性を生じる。", "e": "ターゲット角度との相乗効果でX線焦点サイズは乳頭側より胸壁側のほうが小さくなる。"}, "correct": ["a", "e"], "explanation": "(1)低い線エネルギー成分が多く含まれるほど被ばくが多くなる。(5)ターゲット相乗効果でX線焦点サイズは乳頭側より胸壁側のほうが大きくなる。", "image_url": "", "reference": "", "tags": ["X線スペクトル", "ヒール効果"]}, {"id": "QM1-02", "category": "精度管理マニュアル2023対応", "subcategory": "機器", "question": "誤っているのはどれか。すべて選べ。", "choices": {"a": "グリッドはスペーサとして標準的にファイバが使用されている。", "b": "AECはアナログシステムではカセッテの上部に設置されている。", "c": "グリッド比は4:1、5:1、グリッド密度は31本/cmが使用されている。", "d": "標本化は空間分解能に影響するため、大きいサンプリング間隔が必要である。", "e": "量子化は濃度分解能に影響し、諧調数が多いほど濃度差の小さいものを描出できる。"}, "correct": ["b", "d"], "explanation": "(2)AECはアナログシステムではカセッテの下部に設置されている。(4)標本化は空間分解能に影響するため、小さいサンプリング間隔が必要である。", "image_url": "", "reference": "", "tags": ["グリッド", "標本化", "量子化"]}, {"id": "QM1-03", "category": "精度管理マニュアル2023対応", "subcategory": "デジタル", "question": "デジタルについて誤っているのはどれか。すべて選べ。", "choices": {"a": "ソフトコピーではマンモグラフィ用ビューワソフトが必須である。", "b": "MTFは空間分解能を表す指標である。SCTFと関連した指標が得られる。", "c": "CNRはコントラストが高いほどノイズが小さいほど小さな値を示す指標である。", "d": "画像処理や周波数処理を行うことにより淡い陰影や石灰化などを強調することができる。", "e": "SNRは画像の関心領域の平均画素値と標準偏差の比、背景雑音に対する信号強度の指標である。"}, "correct": ["c"], "explanation": "CNRはコントラストが高いほどノイズが小さいほど大きな値を示す指標である。", "image_url": "", "reference": "", "tags": ["デジタル画像評価"]}, {"id": "QM1-04", "category": "精度管理マニュアル2023対応", "subcategory": "デジタル", "question": "モニタの環境について該当するのはどれか。すべて選べ。", "choices": {"a": "高輝度タイプであること。", "b": "輝度調整機能を有すること。", "c": "マスキング機構を有すること。", "d": "GSDFの諧調特性を有すること。", "e": "5MP以上の解像度を有すること。"}, "correct": ["d", "e"], "explanation": "解説文より、モニタの条件としてGSDFの諧調特性を有することと、5MP以上の解像度を有することが挙げられている。", "image_url": "", "reference": "", "tags": ["モニタ環境"]}, {"id": "QM1-05", "category": "精度管理マニュアル2023対応", "subcategory": "受診者対応", "question": "マンモグラフィ受診者への対応について適切でないのはどれか。すべて選べ。", "choices": {"a": "検査前の待ち時間を利用して検査説明パンフレットを読んでもらう。", "b": "心地良い感じる会話には「適度に相手を見て話す」ことが要求される。", "c": "約70%の情報が非言語コミニュケーションはで伝わるといわれている。", "d": "初対面で好印象を残すための決め手は最初の10秒にあるといわれている。", "e": "コミニュケーションの中で聞き手の感情に最も影響を表すのは音声である。"}, "correct": ["e"], "explanation": "聞き手の感情に最も影響を表すのは顔の表情である。", "image_url": "", "reference": "", "tags": ["受診者対応"]}, {"id": "QM1-06", "category": "精度管理マニュアル2023対応", "subcategory": "標準撮影", "question": "MLO撮影について誤っているのはどれか。すべて選べ。", "choices": {"a": "受診者を正対させ、足は肩幅より大きく開く。", "b": "乳房支持台の角度を大胸筋外側と平行 n": "(1)分泌型石灰化は乳腺症にもみられる。(3)乳癌の石灰化は壊死型と分泌型に分かれる。(2)浸潤性小葉癌は希少がんである。(4)主に分布によって悪性度を考慮する。(5)早期乳癌は大きさが2cm以下などの条件がある。", "image_url": "", "reference": "", "tags": ["乳腺病理", "石灰化"]}, {"id": "QM2-17", "category": "精度管理マニュアル2023対応", "subcategory": "疾患全般", "question": "正しいのはどれか。すべて選べ。", "choices": {"a": "病期は期から4期まである。", "b": "しこりのない炎症性乳癌は1期である。", "c": "他臓器に転移していたらステージ4である。", "d": "乳癌の治療方針は病期(ステージ)によって決まる。", "e": "病期はしこりの大きさとリンパ節転移の2つによって決まる。"}, "correct": ["c", "d"], "explanation": "(3)他臓器転移はステージ4である。(4)治療方針はステージや癌の性質等で決まる。(1)ステージ0から4。(2)炎症性乳癌はステージ3B。(5)リンパ節転移の有無など3つの要素で決まる。", "image_url": "", "reference": "", "tags": ["病期分類"]}, {"id": "QM2-18", "category": "精度管理マニュアル2023対応", "subcategory": "乳がん検診と現状", "question": "乳癌検診について誤っているのはどれか。すべて選べ。", "choices": {"a": "異常なしと分かることは利益である。", "b": "病変がないと分かることで安心するのは利益である。", "c": "生命予後に関係ないものが見つかることは利益である。", "d": "生命に影響しないような癌が見つかることは不利益である。", "e": "検診で早期発見や早期治療によって死亡率が減少するのは利益である。"}, "correct": ["c"], "explanation": "生命予後に関係ないものが見つかることは不利益(過剰診断)である。", "image_url": "", "reference": "", "tags": ["検診の利益と不利益"]}, {"id": "QM2-19", "category": "精度管理マニュアル2023対応", "subcategory": "撮影法全般", "question": "撮影について正しいのはどれか。すべて選べ。", "choices": {"a": "標準撮影では病変に特化した撮影方法を用いてよい。", "b": "密着撮影より拡大撮影のほうが低圧迫の必要がある。", "c": "乳腺の圧迫は少なくとも100N以上必要である。", "d": "乳腺の伸展には技術者の手技が必要で圧迫板で伸展しない。", "e": "通常撮影法はそれを補完するような撮影を追加することも許容されている。"}, "correct": ["c", "d"], "explanation": "(3)少なくとも100N以上必要(圧迫圧100〜120N)。(4)指で広げるように伸展させる。(1)標準撮影では病変に特化した方法を用いない。(2)拡大撮影を低圧迫にする必要はない。(5)明確な目的が必要。", "image_url": "", "reference": "", "tags": ["撮影法原則"]}, {"id": "QM2-20", "category": "精度管理マニュアル2023対応", "subcategory": "画像所見", "question": "正しいはどれか。すべて選べ。", "choices": {"a": "60歳代のほとんどが脂肪性である。", "b": "区域性の石灰化は腺葉に沿ってできたものである。", "c": "石灰化で一腺葉に分布するものは良性の可能性が高い。", "d": "中心透亮性の石灰化が両側に多発している場合はカテゴリー2である。", "e": "石灰化がCCで点状に見えたが、MLOでは微細線状に見えたらカテゴリー4である。"}, "correct": ["b", "d"], "explanation": "(1)60歳代の約30%が脂肪性。(3)腺葉または区域性に乳癌が広がっている可能性。(5)カテゴリー5である。", "image_url": "", "reference": "", "tags": ["画像所見", "カテゴリー"]}, {"id": "AF-01", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "密着撮影は腫瘤性病変に用いる。", "b": "拡大撮影は密着撮影に比べてコントラストが良い。", "c": "拡大撮影は石灰化病変や微細な変化を対象とする。", "d": "側方向撮影は異常部位がフィルムに近くなる方向で撮影する方が良い。", "e": "ML撮影は病巣の位置確認のため、頭尾方向と直行する方向から撮影する。"}, "correct": ["b"], "explanation": "拡大撮影は密着撮影に比べてコントラストがやや劣る。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-02", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "SIO撮影 接線方向", "b": "TAN撮影 接線方向", "c": "CV撮影 内側間隙方向", "d": "XCC撮影 外側頭尾方向", "e": "AT撮影 腋窩尾部用内外斜位方向"}, "correct": ["a"], "explanation": "SIO撮影は外上・内下斜方向である。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-03", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "B領域で可動性が良い場合は接線撮影を試しても良い。", "b": "接線撮影は腫瘤の存在診断、鑑別診断に最も有効な撮影手技である。", "c": "A領域の病変は乳頭腫瘍線に沿ってSIO方向撮影を基本的に選択する。", "d": "スポット圧迫板は小さい方が効果的であり、病巣の位置決めもしやすい。", "e": "接線撮影は乳房中心部に存在する腫瘤には不適であるが、施行可能である。"}, "correct": ["d"], "explanation": "スポット圧迫板は小さい方が効果的であるが、病巣の位置決めは困難である。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-04", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "LM撮影は沈降性石灰描出に用いられる。", "b": "90°側面撮影は病変の位置を決定するのに用いられる。", "c": "AT(腋窩稜)撮影は乳房外側に重点を置いた撮影法である。", "d": "SIO撮影はA領域上部の腫瘤を撮影するのに有効な方法である。", "e": "スポット撮影は偽陰性や偽陽性に判定される可能性を少なくする最も効果の高い追加撮影法である。"}, "correct": ["c"], "explanation": "AT(腋窩稜)撮影は乳房外側と腋窩の全域を描出するための撮影法である。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-05", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "LM撮影は男性乳房の撮影が容易である。", "b": "XCC撮影は乳房外側に重点を置いた撮影法である。", "c": "LM撮影は特に痩せた体格の小乳房の撮影が容易である。", "d": "XCC撮影はCC撮影に対し、それを補足する撮影法である。", "e": "FADで腫瘤が触知できない場合、スポット撮影は有効である。"}, "correct": ["d"], "explanation": "XCC撮影はCC撮影に対し、それを補足する撮影法である。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-06", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "拡大撮影は0.1mmの小焦点を使用する。", "b": "TAN撮影は病変の描出を改善する最も効果的な方法である。", "c": "FB撮影は乳房上部に腫瘤を持つ受診者を撮影する方法である。", "d": "CV撮影は乳房の内側後方の深部を描出するのに良い方法である。", "e": "スポット撮影では必ずX線束のコリメーションをする必要がある。"}, "correct": ["e"], "explanation": "スポット撮影では散乱線減少によるコントラストや解像力が改善され、正確な読影が可能となるため、必ずX線束のコリメーションをする必要はない。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-07", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているものはどれか。", "choices": {"a": "拡大撮影は拡大倍率1.5〜1.8倍が良い。", "b": "接線撮影はスポット撮影との併用が効果的である。", "c": "拡大撮影は石灰化や腫瘤辺縁を確認するときに用いる。", "d": "触知不能である乳房に対してスポット撮影は無効である。", "e": "スポット撮影は乳腺の重なりか腫瘤かを区別するために撮影される。"}, "correct": ["d"], "explanation": "触知不能である乳房に対してスポット撮影は有効である。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-08", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "拡大撮影はエアギャップ効果が生まれる。", "b": "XCC撮影では内側乳腺が欠損しても良い。", "c": "密着撮影はよく観察するために小焦点を使用する。", "d": "接線撮影は皮膚近くの組織に石灰化の存在を明らかにするときに用いる。", "e": "密着撮影は腫瘤性病変に用い、拡大撮影は石灰化病変や微細な変化を対象とするときに用いる。"}, "correct": ["c"], "explanation": "密着撮影は大焦点を使用する。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-09", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "A領域の病変はSIO方向撮影を基本的に選択する。", "b": "スポット撮影はできるだけ強く圧迫するほうが良い。", "c": "接線撮影は腫瘤の胸壁側をやや強めに抑えるほうが良い。", "d": "CD領域は様々な方向、手技を用いての撮影が可能である。", "e": "B領域の病変で可動性が良い場合は接線撮影を試みても良い。"}, "correct": ["b"], "explanation": "スポット撮影は嚢胞性病変などでは破裂を伴うこともあり、むやみに強く圧迫することは危険である。", "image_url": "", "reference": "", "tags": ["追加撮影"]}, {"id": "AF-10", "category": "撮影法", "subcategory": "追加撮影", "question": "次のうち誤っているのはどれか。", "choices": {"a": "LMO撮影は外側の病変部に有効である。", "b": "FB撮影は上部にmassがあるものに使用する。", "c": "腋窩撮影は上腕と肋骨を入れて腋窩部は広く全体が入るように撮影する。", "d": "腫瘤自体が微小である場合は、積極的に拡大スポット撮影を行うようにする。", "e": "全体方向像でカテゴリー2と判断された場合は良悪性のための追加撮影は行わない。"}, "correct": ["a"], "explanation": "LM撮影は乳房の内側に病変がある場合に有効であり、LMO撮影は乳房外側に腫瘤をもつ受診者を撮影する撮影法である。", "image_url": "", "reference": "",
